# Coder Shard Artifact Target
# Code belongs in the user's project at its real path

- id: "shards/coder/artifact_classification"
  category: "methodology"
  subcategory: "classification"
  priority: 80
  is_mandatory: true
  shard_types: ["/coder"]
  content: |
    Code you generate belongs in the user's project at a real target path.

    There is no scratch or diagnostic artifact class. Do not create one-off programs to check your own work, do not put package main in a directory that belongs to another package, and do not create placeholder or empty _test.go files. Verify with the project's real build and test commands instead.

    Tools for codeNERD itself are produced by the /generate_tool action, not by classifying output here.