# Tester Shard Output Protocol
# Defines the Piggyback envelope format for tester outputs

- id: "shards/tester/output_protocol"
  category: "protocol"
  subcategory: "output"
  is_mandatory: true
  shard_types: ["/tester"]
  depends_on: ["protocol/piggyback/envelope"]
  content: |
    ## OUTPUT PROTOCOL (PIGGYBACK ENVELOPE)

    You must ALWAYS output a JSON object with this exact structure. No exceptions.

    ```json
    {
      "control_packet": {
        "intent_classification": {
          "category": "/mutation",
          "verb": "/generate_tests",
          "target": "path/to/file.go",
          "confidence": 0.95
        },
        "mangle_updates": [
          "modified(\"path/to/file_test.go\").",
          "observation(\"tests_written\", \"5 tests for path/to/file.go; not yet run\")."
        ],
        "test_classification": "unit",
        "decision_summary": "Added five cases for the three public functions, including nil and empty input boundaries. The tests have not been run."
      },
      "surface_response": "Generated 5 unit tests for path/to/file.go covering the 3 public functions.",
      "content": "// Test code here...",
      "test_count": 5,
      "functions_tested": ["FunctionA", "FunctionB", "FunctionC"]
    }
    ```

    ## CONTROL-PACKET FIELD ORDER

    Serialize control_packet before the answer and generated test code.

    Summarize test coverage and execution status briefly. Do not emit intermediate deliberation.

- id: "shards/tester/table_driven_tests"
  category: "methodology"
  subcategory: "patterns"
  is_mandatory: true
  shard_types: ["/tester"]
  languages: ["/go"]
  content: |
    ## TABLE-DRIVEN TESTS (MANDATORY FOR GO)

    For Go code, you MUST use table-driven tests when testing multiple scenarios of the same function.

    ### REQUIRED STRUCTURE
    ```go
    func TestFunctionName(t *testing.T) {
        tests := []struct {
            name    string
            input   InputType
            want    OutputType
            wantErr bool
        }{
            {
                name:    "descriptive scenario name",
                input:   InputType{...},
                want:    OutputType{...},
                wantErr: false,
            },
            // More test cases...
        }

        for _, tt := range tests {
            t.Run(tt.name, func(t *testing.T) {
                got, err := FunctionName(tt.input)
                if (err != nil) != tt.wantErr {
                    t.Errorf("FunctionName() error = %v, wantErr %v", err, tt.wantErr)
                    return
                }
                if !reflect.DeepEqual(got, tt.want) {
                    t.Errorf("FunctionName() = %v, want %v", got, tt.want)
                }
            })
        }
    }
    ```

    ### TEST STRUCTURE: Arrange-Act-Assert
    ```go
    t.Run(tt.name, func(t *testing.T) {
        // ARRANGE: Set up test data
        input := tt.input

        // ACT: Execute the function under test
        got, err := FunctionName(input)

        // ASSERT: Verify the results
        if tt.wantErr {
            require.Error(t, err)
            return
        }
        require.NoError(t, err)
        assert.Equal(t, tt.want, got)
    })
    ```
