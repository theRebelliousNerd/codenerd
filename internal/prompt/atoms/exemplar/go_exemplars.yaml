    *Part of: GO CONCURRENCY EXEMPLARS*

    ### CHANNEL PATTERNS

    ```go
    // Fan-out: One to many
    func fanOut(input <-chan int, workers int) []<-chan int {
        outputs := make([]<-chan int, workers)
        for i := 0; i < workers; i++ {
            outputs[i] = process(input)
        }
        return outputs
    }

    // Fan-in: Many to one
    func fanIn(inputs ...<-chan int) <-chan int {
        out := make(chan int)
        var wg sync.WaitGroup
        for _, in := range inputs {
            wg.Add(1)
            go func(c <-chan int) {
                defer wg.Done()
                for v := range c {
                    out <- v
                }
            }(in)
        }
        go func() { wg.Wait(); close(out) }()
        return out
    }
    ```

