  content: |
    *Part of: __init__ vs __new__ CONFUSION*

    ### Correct Singleton

    ```python
    # CORRECT - Guard __init__
    class Singleton:
        _instance = None
        _initialized = False

        def __new__(cls):
            if cls._instance is None:
                cls._instance = super().__new__(cls)
            return cls._instance

        def __init__(self):
            if not Singleton._initialized:
                self.value = 0
                Singleton._initialized = True
    ```

    ### When to Use __new__

    ```python
    # 1. Singletons
    # 2. Subclassing immutable types
    class MyStr(str):
        def __new__(cls, value):
            # str is immutable, must set value in __new__
            return super().__new__(cls, value.upper())

    # 3. Object caching/pooling
    class CachedInt:
        _cache = {}

        def __new__(cls, value):
            if value not in cls._cache:
                cls._cache[value] = super().__new__(cls)
            return cls._cache[value]
    ```

