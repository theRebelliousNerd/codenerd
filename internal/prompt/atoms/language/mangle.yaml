# Mangle Logic Programming Language Atoms
# Mangle (TauCeti's canonical mangle-go, codeberg.org/TauCeti/mangle-go v0.7) for the codeNERD kernel.
# Every ```mangle fence is parsed and analyzed by the pinned engine in
# internal/prompt/atoms_mangle_truth_test.go.

- id: "language/mangle/core"
  category: "language"
  subcategory: "mangle"
  is_mandatory: true
  languages: ["/mangle"]
  # Served with language/mangle/engine_truths_pinned when the kernel derives
  # /authoring_mangle (policy/jit_needs.mg); relevance-admitted atoms add the rest.
  world_states: ["authoring_mangle"]
  content: |
    ## MANGLE LANGUAGE CORE

    Mangle is a deductive database language. codeNERD runs TauCeti's canonical mangle-go engine (v0.7), not Google's frozen snapshot. A program is facts (the EDB), rules that derive new facts (the IDB), and one `Decl` per predicate. In codeNERD Go asserts what it measured (witnesses) and rules derive every decision (judgements): Go never asserts a judgement, and no threshold lives in Go when it can be a fact.

    ### SYNTAX BASICS
    ```mangle
    Decl user(Name, Role) bound [/string, /name].
    Decl file_size(File, Bytes) bound [/string, /number].
    Decl admin(Name) bound [/string].
    Decl can_edit(Name, File) bound [/string, /string].

    user("alice", /admin).                 # a fact; every clause ends with '.'
    user("bob", /viewer).
    file_size("src/main.go", 100).

    admin(Name) :- user(Name, /admin).     # a rule: Head :- Body.
    can_edit(Name, File) :- admin(Name), file_size(File, Bytes).
    ```

- id: "language/mangle/core/conventions-and-data"
  section_of: "language/mangle/core"
  section_order: 1
  category: "language"
  subcategory: "mangle"
  is_mandatory: false
  languages: ["/mangle"]
  # Served with language/mangle/engine_truths_pinned when the kernel derives
  # /authoring_mangle (policy/jit_needs.mg); relevance-admitted atoms add the rest.
  world_states: ["authoring_mangle"]
  content: |
    ## MANGLE LANGUAGE CORE: conventions and data

    ### CONVENTIONS
    - UPPERCASE is a variable; `/lowercase` a name constant (enums, IDs); `"quoted"` a string. `/admin` and `"admin"` never unify.
    - `_` is a don't-care variable. Never put one inside a negated literal: it is an analysis error (see the engine truths).
    - `#` starts a comment. Numbers are int64 and floats are a separate type: `<` and `fn:plus` take numbers only, so use an integer scale (0..100) for scores or the `:float:` predicates.
    - Declare every predicate exactly once, before use, with `bound [...]` column types.
    - Data: `status(/active).` name; `label("free text").` string; `count(42).` number; `items([1, 2, 3]).` list.

- id: "language/mangle/rules"
  category: "language"
  subcategory: "mangle"
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    ## MANGLE RULES

    ### RULE STRUCTURE
    ```mangle
    # head :- body.   "head is true if every premise in the body is true"
    Decl user(User, Role) bound [/name, /name].
    Decl permission(Role, File) bound [/name, /string].
    Decl file(Path) bound [/string].

    admin(X) :- user(X, /admin).

    can_access(User, File) :-
        user(User, Role),
        permission(Role, File).

    no_access(User, File) :-
        user(User, Role),
        file(File),
        !can_access(User, File).
    ```

    ### SAFETY RULES
    Every head variable and every variable inside `!` must be bound by a positive premise.
    ```mangle-rejected
    admin(X) :- !blocked(X).
    ```
    ```mangle
    admin(X) :- user(X, Role), !blocked(X).
    ```

    ### RECURSION
    ```mangle
    Decl edge(X, Y) bound [/name, /name].
    reachable(X, Y) :- edge(X, Y).
    reachable(X, Z) :- edge(X, Y), reachable(Y, Z).
    ```

- id: "language/mangle/aggregation"
  category: "language"
  subcategory: "mangle"
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    ## MANGLE AGGREGATION

    ### TRANSFORM SYNTAX
    ```mangle
    Decl user(Name, Role) bound [/name, /name].
    Decl file(Path, Size) bound [/string, /number].
    user_count(Count) :-
        user(Name, Role) |> do fn:group_by(), let Count = fn:count().

    total_size(Total) :-
        file(Path, Size) |> do fn:group_by(), let Total = fn:sum(Size).

    role_count(Role, Count) :-
        user(Name, Role) |> do fn:group_by(Role), let Count = fn:count().
    ```

    ### COMMON AGGREGATIONS
    | Function | Purpose |
    |----------|---------|
    | `fn:count()` | Count rows |
    | `fn:sum(X)` | Sum values |
    | `fn:min(X)` | Minimum value |
    | `fn:max(X)` | Maximum value |
    | `fn:collect(X)` | Collect into list |

    ### AGGREGATION PATTERNS
    ```mangle
    Decl file(Path, Size) bound [/string, /number].
    max_size(Max) :- file(Path, Size) |> do fn:group_by(), let Max = fn:max(Size).
    largest_file(Path, Size) :- file(Path, Size), max_size(Size).
    ```
    Files per directory: assert the directory as a column in Go (a string-prefix test is a premise, not a group key), then group by it.

- id: "language/mangle/codenerd"
  category: "language"
  subcategory: "mangle"
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    ## MANGLE IN CODENERD

    ### COMMON PREDICATES (declared in internal/core/defaults/schemas*.mg)
    - `user_intent(ID, Category, Verb, Target, Constraint)`: 5 arguments
    - `next_action(ActionType)`, `permitted(ActionType, Target, Payload)`
    - `pending_action(ActionID, ActionType, Target, Payload, Timestamp)`
    - `dangerous_action(ActionType)`, `safe_action(ActionType)`

    ### POLICY RULES
    ```mangle
    next_action(/code) :-
        user_intent(I, /mutation, /create, Target, Constraint),
        safe_action(/code).

    permitted(Action, Target, Payload) :-
        safe_action(Action),
        pending_action(Id, Action, Target, Payload, At),
        !dangerous_content(Action, Payload).
    ```

    ### SCHEMA DECLARATIONS
    ```mangle
    Decl user_intent(ID, Category, Verb, Target, Constraint) bound [/name, /name, /name, /string, /string].
    Decl hypothesis(HType, File, Line, Confidence) bound [/name, /string, /number, /number].
    ```
    Column types go in `bound [...]`, one per column. See the codenerd atoms for the kernel's real predicates.
