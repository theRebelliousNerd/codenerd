# Mangle Logic Programming Language Atoms
# Mangle (TauCeti's canonical mangle-go) for the codeNERD kernel

- id: "language/mangle/core"
  category: "language"
  subcategory: "mangle"
  priority: 95
  is_mandatory: true
  languages: ["/mangle"]
  # Served with language/mangle/engine_truths_pinned when the kernel derives
  # /authoring_mangle (policy/jit_needs.mg); relevance-admitted atoms add the rest.
  world_states: ["authoring_mangle"]
  content: |
    ## MANGLE LANGUAGE CORE

    Mangle is a deductive database programming language. codeNERD runs TauCeti's canonical
    mangle-go engine (the v0.5.1 line), not Google's frozen 0.4.0 snapshot. A program is facts
    (the EDB), rules that derive new facts (the IDB), and one `Decl` per predicate. In codeNERD
    Go asserts what it measured (witnesses) and rules derive every decision (judgements): never
    make Go assert a judgement, and never let a threshold live in Go when it can be a fact.

    ### SYNTAX BASICS
    ```mangle
    Decl user(Name, Role) bound [/string, /name].
    Decl file_size(File, Bytes) bound [/string, /number].
    Decl admin(Name) bound [/string].
    Decl can_edit(Name, File) bound [/string, /string].

    user("alice", /admin).                 # a fact; every clause ends with '.'
    user("bob", /viewer).
    file_size("src/main.go", 100).

    admin(Name) :- user(Name, /admin).     # a rule: Head :- Body.
    can_edit(Name, File) :- admin(Name), file_size(File, Bytes).
    ```

    ### CONVENTIONS
    - UPPERCASE is a variable. `/lowercase` is a name constant (enumerations, IDs, verbs).
      `"quoted"` is a string. `/admin` and `"/admin"` are different values that never unify.
    - `_` is a variable you do not care about. Never put one inside a negated literal: the
      negation is silently deleted (see the engine truths).
    - `#` starts a comment.
    - Numbers are int64. A float in a number column aborts the whole fixpoint: use an integer
      scale (0..100) for scores and percentages.
    - Declare every predicate exactly once, before use, with `bound [...]` column types.

    ### DATA
    ```mangle
    status(/active).          # name constant
    label("free text").       # string
    count(42).                # number
    items([1, 2, 3]).         # list
    ```

- id: "language/mangle/rules"
  category: "language"
  subcategory: "mangle"
  priority: 90
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    ## MANGLE RULES

    ### RULE STRUCTURE
    ```mangle
    # head :- body.
    # "head is true if body is true"

    # Single condition
    Decl user(User, Role).
    Decl permission(Role, File).
    Decl file(X, Y).
    admin(X) :- user(X, "/admin").

    # Multiple conditions (AND)
    can_access(User, File) :-
        user(User, Role),
        permission(Role, File).

    # Negation
    no_access(User, File) :-
        user(User, _),
        file(File, _),
        !can_access(User, File).
    ```

    ### SAFETY RULES
    All variables in head must appear in positive body:
    ```mangle
    # SAFE: X bound in user()
    admin(X) :- user(X, "/admin").

    # UNSAFE: X not bound
    admin(X) :- !blocked(X).  # ERROR

    # FIX: Bind X first
    admin(X) :- user(X, _), !blocked(X).
    ```

    ### RECURSION
    ```mangle
    # Base case
    Decl edge(X, Y).
    reachable(X, Y) :- edge(X, Y).

    # Recursive case
    reachable(X, Z) :- edge(X, Y), reachable(Y, Z).
    ```

- id: "language/mangle/aggregation"
  category: "language"
  subcategory: "mangle"
  priority: 85
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    ## MANGLE AGGREGATION

    ### TRANSFORM SYNTAX
    ```mangle
    # Count
    Decl user(X, Y).
    Decl file(X, Y).
    user_count(Count) :-
        user(_, _) |> do fn:group_by(), let Count = fn:count().

    # Sum
    total_size(Total) :-
        file(_, Size) |> do fn:group_by(), let Total = fn:sum(Size).

    # Group by
    role_count(Role, Count) :-
        user(_, Role) |> do fn:group_by(Role), let Count = fn:count().
    ```

    ### COMMON AGGREGATIONS
    | Function | Purpose |
    |----------|---------|
    | `fn:count()` | Count rows |
    | `fn:sum(X)` | Sum values |
    | `fn:min(X)` | Minimum value |
    | `fn:max(X)` | Maximum value |
    | `fn:collect(X)` | Collect into list |

    ### AGGREGATION PATTERNS
    ```mangle
    # Files per directory
    files_in_dir(Dir, Count) :-
        file(Path, _),
        fn:starts_with(Path, Dir)
        |> do fn:group_by(Dir), let Count = fn:count().

    # Largest file
    largest_file(Path, Size) :-
        file(Path, Size),
        max_size(Size).
    max_size(Max) :-
        file(_, Size) |> do fn:group_by(), let Max = fn:max(Size).
    ```

- id: "language/mangle/codenerd"
  category: "language"
  subcategory: "mangle"
  priority: 80
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    ## MANGLE IN CODENERD

    ### COMMON PREDICATES
    ```mangle
    # Intent classification (5 args: ID, Category, Verb, Target, Constraint)
    user_intent(ID, Category, Verb, Target, Constraint).

    # Actions
    next_action(Action).
    permitted(ActionType, Target, Payload).

    # Context
    current_file(Path).
    current_function(Name, File, Line).

    # Safety
    forbidden(ActionType).
    dangerous_action(ActionType).
    requires_approval(ActionType).
    ```

    ### POLICY RULES
    ```mangle
    # Derive next action from intent
    Decl user_intent(A1, A2, A3, A4, A5).
    Decl safe_action(Action).
    Decl pending_action(A1, A2, A3, A4, A5).
    Decl dangerous_content(Action, Payload).
    next_action(/code) :-
        user_intent(_, /mutation, /create, _, _),
        safe_action(/code).

    # Permission gate
    permitted(Action, Target, Payload) :-
        safe_action(Action),
        pending_action(_, Action, Target, Payload, _),
        !dangerous_content(Action, Payload).
    ```

    ### SCHEMA DECLARATIONS
    ```mangle
    # Declare predicate signatures with Mangle Type<> syntax
    Decl user_intent(ID, Category, Verb, Target, Constraint) bound [/name, /name, /name, /string, /string].

    Decl file_modified(Path, Lines) bound [/string, /number].

    Decl hypothesis(HType, File, Line, Confidence) bound [/name, /string, /number, /number].
    ```
