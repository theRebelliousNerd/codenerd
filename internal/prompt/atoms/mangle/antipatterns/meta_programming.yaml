    ## Anti-Pattern 7: Decorators / Annotations
    
    ### Wrong Approach
    ```python
    @cache
    @validate_input
    def expensive_function(x):
        return x * 2
    ```
    
    Attempting:
    ```mangle
    # WRONG - no decorators
    @cache
    @validate
    expensive(X, Y) :- Y = fn:times(X, 2).
    ```
    
    ### Why It Fails
    No decorator or annotation system.
    
    ### Correct Mangle Way
    ```mangle
    # Manually compose:
    Decl expensive_core(X, Y) bound [/number, /number].
    expensive_core(X, Y) :- Y = fn:times(X, 2).
    
    # Validation wrapper:
    Decl validated_expensive(X, Y) bound [/number, /number].
    validated_expensive(X, Y) :-
        validate_input(X),
        expensive_core(X, Y).
    
    # Cache wrapper (simulate with memoization facts):
    Decl cached_expensive(X, Y) bound [/number, /number].
    
    cached_expensive(X, Y) :- cache_entry(/expensive, X, Y).
    
    cached_expensive(X, Y) :-
        not cache_entry(/expensive, X, _),
        validated_expensive(X, Y).
        # In Go: store the result as cache_entry
    ```
    
