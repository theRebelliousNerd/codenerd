    ## Anti-Pattern 10: Quasiquotation
    
    ### Wrong Approach
    ```lisp
    ; Lisp quasiquotation
    `(+ 1 ,(* 2 3))  ; => (+ 1 6)
    ```
    
    Attempting:
    ```mangle
    # WRONG - no quasiquotation
    template(Expr) :-
        Expr = `add(1, ~{multiply(2, 3)})`.  # Not possible
    ```
    
    ### Why It Fails
    No quasiquotation or template syntax.
    
    ### Correct Mangle Way
    ```mangle
    # Build expressions as data structures:
    Decl expr(Id, Op) bound [/name, /name].
    Decl expr_arg(ExprId, Index, ArgId) bound [/name, /number, /name].
    Decl expr_const(Id, Value) bound [/name, /number].
    
    # Build: add(1, multiply(2, 3))
    expr(/e1, /add).
    expr_arg(/e1, 0, /c1).
    expr_const(/c1, 1).
    expr_arg(/e1, 1, /e2).
    expr(/e2, /multiply).
    expr_arg(/e2, 0, /c2).
    expr_const(/c2, 2).
    expr_arg(/e2, 1, /c3).
    expr_const(/c3, 3).
    
    # Evaluate the expression tree
    ```
    
