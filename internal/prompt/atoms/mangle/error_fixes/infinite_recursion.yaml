  content: |
    *Part of: Fix: Infinite Recursion > Common Patterns*

    ### 4. Cartesian Product Explosion

    **Problem:**
    ```mangle
    # EXPLOSIVE - creates huge intermediate result
    Decl big_table1(X).
    Decl big_table2(Y).
    Decl big_table3(Z).
    combo(X, Y, Z) :- big_table1(X), big_table2(Y), big_table3(Z).
    ```

    **Fix:** Add early filters
    ```mangle
    Decl filter_condition(X).
    Decl big_table1(X).
    Decl related(X, Y).
    Decl big_table2(Y).
    Decl derives(Y, Z).
    Decl big_table3(Z).
    combo(X, Y, Z) :-
        filter_condition(X),  # Reduce X first
        big_table1(X),
        related(X, Y),        # Only related Y
        big_table2(Y),
        derives(Y, Z),        # Only derives Z
        big_table3(Z).
    ```

- id: "language/mangle/docs/error_fixes/infinite_recursion/prevention-strategies"
  section_of: "language/mangle/docs/error_fixes/infinite_recursion"
  section_order: 2
  category: "language"
  subcategory: "mangle"
  description: "Fix: Infinite Recursion: Prevention Strategies"
  priority: 30
  is_mandatory: false
  languages: ["/mangle"]
  content: |
    *Part of: Fix: Infinite Recursion*

    ## Prevention Strategies

    ### 1. Always Limit Recursive Depth

    ```mangle
    # Safe recursive pattern
    Decl start(Start).
    Decl transition(Curr, Next).
    step(0, Start) :- start(Start).
    step(N, Next) :-
        step(M, Curr),
        transition(Curr, Next),
        N = fn:plus(M, 1),
        M < 50.  # MUST have limit
    ```

    ### 2. Use Monotonic Progress

    ```mangle
    # Each step must make measurable progress. No "only new paths" negation
    # is needed or possible here: facts are a set (re-deriving path(X,Z,N)
    # adds nothing), and negating the predicate being defined — let alone
    # with a wildcard — is unstratifiable and rejected at analysis. The
    # depth bound is what terminates cyclic graphs, because N keeps growing.
    path(X, Y, 1) :- edge(X, Y).
    path(X, Z, N) :-
        path(X, Y, M),
        edge(Y, Z),
        M < 20
        |> let N = fn:plus(M, 1).
    ```

    ### 3. Filter Before Join

    ```mangle
    # Good: filter first, then join
    Decl table1(X, Y).
    Decl table2(X, Y).
    result(X, Y) :-
        X = /specific_value,  # Filter first
        table1(X, _),
        table2(X, Y).
    ```

