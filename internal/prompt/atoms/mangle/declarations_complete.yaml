    # Mangle Type Declarations - Complete Reference
    
    ## Declaration Syntax
    
    ### Basic Structure
    ```mangle
    Decl predicate_name(Arg1, Arg2, ...).
    ```
    
    **CRITICAL**:
    - Keyword is `Decl` (capital D)
    - Each argument is a variable name; the types are listed in `bound [/type, ...]` in argument order
    - Must end with period (`.`)
    
    ## Primitive Types
    
    ### Integer
    ```mangle
    Decl age(Person, Age) bound [/name, /number].
    Decl count(Category, Count) bound [/name, /number].
    ```
    
    ### Float
    ```mangle
    Decl price(Item, Price) bound [/name, /float64].
    Decl salary(Employee, Amount) bound [/name, /float64].
    ```
    
    ### String
    ```mangle
    Decl message(ID, Text) bound [/number, /string].
    Decl error(Code, Message) bound [/number, /string].
    ```
    
    ### Name (Atom)
    ```mangle
    Decl status(Entity, State) bound [/name, /name].
    Decl tag(Item, Tag) bound [/name, /name].
    ```
    Type code `n` means "name" (atom constant like `/active`)
    
    ## Structured Types
    
    ### List Types
    ```mangle
    # List of integers
    Decl scores(Student, Scores).
    
    # List of strings
    Decl tags(ID, Tags).
    
    # List of names
    Decl dependencies(Project, Deps).
    
    # Nested list
    Decl matrix(ID, Data).
    ```
    
    ### Map Types
    ```mangle
    # Simple map
    Decl config(ID, Settings).
    
    # Map with multiple value types
    Decl metadata(ID, Data).
    ```
    
    ### Struct Types
    ```mangle
    # Person struct
    Decl person(ID, Info).
    
    # Configuration struct
    Decl server_config(Name, Config).
    
    # Nested struct
    Decl record(ID, Data).
    ```
    
    ### Union Types
    ```mangle
    # Value can be int OR string
    Decl flexible_value(ID, Val).
    
    # Multiple type options
    Decl mixed_data(Key, Value).
    ```
    
    ### Any Type
    ```mangle
    # Accept any type
    Decl generic(ID, Value).
    ```
    
    ## Mode Declarations (Advanced)
    
    ### Input/Output Modes
    ```mangle
    # Both arguments are input (bound)
    Decl edge(From [bound], To [bound]) bound [/name, /name].
    
    # First input, second output (free)
    Decl parent(Parent [bound], Child [free]) bound [/name, /name].
    
    # Mixed modes
    Decl lookup(Key [bound], Value [free]) bound [/name, /string].
    ```
    
    ### Mode Patterns
    - `[bound]` - Argument must be provided (input)
    - `[free]` - Argument will be generated (output)
    - No mode specified = both directions allowed
    
    ## Type Checking
    
    ### Gradual Typing
    Declarations are **optional** in Mangle:
    
    ```mangle
    # No declaration needed - types inferred
    data(1, "test").
    data(2, 42).
    ```
    
    ### Runtime Type Checking
    When declarations exist, Mangle checks types at runtime:
    
    ```mangle
    Decl score(Player, Points) bound [/name, /number].
    
    score(/alice, 100).       # ✅ OK
    score(/bob, "fifty").     # ❌ Type error!
    ```
    
    ## Common Declaration Patterns
    
    ### EDB Predicates (Base Facts)
    ```mangle
    # External data from files/databases
    Decl employee(ID, Name, Dept) bound [/number, /string, /name].
    Decl salary(EmpID, Amount) bound [/number, /float64].
    Decl project(ID, Name, Status) bound [/name, /string, /name].
    ```
    
    ### IDB Predicates (Derived Rules)
    ```mangle
    # Computed predicates
    Decl high_earner(Name, Salary) bound [/string, /float64].
    Decl department_count(Dept, Count) bound [/name, /number].
    ```
    
    ### Virtual Predicates (Go Integration)
    ```mangle
    # Implemented in Go via VirtualStore
    Decl file_content(Path, Content) bound [/string, /string].
    Decl recall_similar(Query, Results).
    Decl symbol_at(Path, Line, Symbol) bound [/string, /number, /string].
    ```
    
    ## Type Declaration Anti-Patterns
    
    ### Soufflé Syntax (WRONG)
    ```mangle
    # ❌ WRONG - Soufflé style
    .decl dependency(app: string, lib: string)
    
    # ✅ CORRECT - Mangle syntax
    Decl dependency(App, Lib) bound [/string, /string].
    ```
    
    ### Missing Type<> Wrapper (WRONG)
    ```mangle
    # ❌ WRONG
    Decl person(Name.string, Age.int).
    
    # ✅ CORRECT
    Decl person(Name, Age) bound [/string, /number].
    ```
    
    ### TypeScript/Java Style (WRONG)
    ```mangle
    # ❌ WRONG
    type Person = { name: string, age: int }
    
    # ✅ CORRECT
    Decl person(ID, Info).
    ```
    
    ### SQL Style (WRONG)
    ```mangle
    # ❌ WRONG
    CREATE TABLE employee (id INT, name VARCHAR)
    
    # ✅ CORRECT
    Decl employee(ID, Name) bound [/number, /string].
    ```
    
    ## Type Code Reference
    
    | Type Code | Mangle Type | Go Type | Examples |
    |-----------|-------------|---------|----------|
    | `int` | 64-bit integer | `int64` | `42`, `-17` |
    | `float` | 64-bit float | `float64` | `3.14`, `-2.5` |
    | `string` | UTF-8 string | `string` | `"hello"` |
    | `n` | Name (atom) | `Atom` | `/active`, `/user1` |
    | `[T]` | List of T | `List` | `[1, 2, 3]` |
    | `{/k: v}` | Map/Struct | `Map`/`Struct` | `{/x: 10}` |
    | `T1 \| T2` | Union type | - | (runtime check) |
    | `Any` | Universal type | `Value` | (any value) |
    
    ## Advanced Type Features
    
    ### Lattice Types (Experimental)
    ```mangle
    # Track maximal elements under partial order
    Decl interval(Var, Lower, Upper) [lattice].
    ```
    **Status**: Experimental feature in newer Mangle versions
    
    ### Recursive Types
    ```mangle
    # List is recursively defined
    Decl tree(Node, Children).
    
    # Each child can have its own children
    tree_node(Node, Children) :- tree(Node, Children).
    ```
    
    ## Type Inference
    
    Mangle infers types from usage when no declaration:
    
    ```mangle
    # No declaration
    fact(1, "test", /atom).
    
    # Mangle infers:
    # fact(Type<int>, Type<string>, Type<n>)
    ```
    
    Type inference works bottom-up from base facts through rules.
    
    ## Type Safety Guarantees
    
    ### With Declarations
    - Type errors caught at runtime
    - Clear API contract for predicates
    - Better error messages
    
    ### Without Declarations
    - Flexible development
    - No type checking overhead
    - Types inferred from data
    
    ## Virtual Predicate Type Mapping (Go Integration)
    
    When implementing virtual predicates in Go:
    
    ```mangle
    Decl virtual_pred(ID, Name, Value) bound [/number, /string, /float64].
    ```
    
    Maps to Go signature:
    ```go
    func VirtualPred(query Query, callback func(Atom) error) error {
        // query.Args[0] - int64
        // query.Args[1] - string
        // query.Args[2] - float64
    }
    ```
    
    ### Type Mapping Table
    
    | Mangle Type | Go Constant Type |
    |-------------|------------------|
    | `Type<int>` | `engine.Number` (int64) |
    | `Type<float>` | `engine.Float64` |
    | `Type<string>` | `engine.String` |
    | `Type<n>` | `engine.Atom` |
    | `Type<[T]>` | `engine.List` |
    | `Type<{...}>` | `engine.Map` or `engine.Struct` |
    
    ## Best Practices
    
    ### When to Declare Types
    
    **DO declare types for:**
    - Public APIs and interfaces
    - Virtual predicates (Go integration)
    - External data predicates
    - Complex structured data
    
    **Can SKIP declarations for:**
    - Internal helper predicates
    - Rapid prototyping
    - Simple fact-only data
    
    ### Naming Conventions
    
    ```mangle
    # Descriptive argument names
    Decl employee(EmployeeID, FullName, Department) bound [/number, /string, /name].
    
    # NOT generic names
    Decl employee(X, Y, Z) bound [/number, /string, /name].
    ```
    
    ### Consistency
    
    Keep related predicates consistent:
    ```mangle
    Decl employee(ID, Name) bound [/number, /string].
    Decl department(ID, Name) bound [/number, /string].
    Decl project(ID, Name) bound [/number, /string].
    # All use same ID/Name pattern
    ```
