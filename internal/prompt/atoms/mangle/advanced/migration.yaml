    # Migrating to Mangle from Other Logic Languages
    
    ## From Soufflé
    
    Soufflé is a high-performance Datalog variant. Mangle shares many concepts but has different syntax.
    
    ### Declaration Syntax
    
    #### Soufflé
    ```souffle
    .decl edge(x:number, y:number)
    .decl path(x:number, y:number)
    ```
    
    #### Mangle
    ```mangle
    Decl edge(X, Y) bound [/number, /number].
    Decl path(X, Y) bound [/number, /number].
    ```
    
    **Changes**:
    - `.decl` → `Decl` (capitalized, no dot)
    - `x:number` → `X`, with `bound [/number]` after the Decl's argument list (uppercase variable; types go in the bound list)
    - `:` → `.` separator
    - `number` → `int` (or `float`)
    
    ### Variables
    
    #### Soufflé
    ```souffle
    path(x, y) :- edge(x, y).
    ```
    
    #### Mangle
    ```mangle
    Decl edge(X, Y).
    path(X, Y) :- edge(X, Y).
    ```
    
    **Change**: Variables must be UPPERCASE.
    
    ### Facts
    
    #### Soufflé
    ```souffle
    edge(1, 2).
    edge(2, 3).
    ```
    
    #### Mangle
    ```mangle
    edge(1, 2).
    edge(2, 3).
    ```
    
    **Same!** ✓
    
    ### Atoms (Symbols)
    
    #### Soufflé
    ```souffle
    .decl status(id:symbol, status:symbol)
    status("user1", "active").
    ```
    
    #### Mangle
    ```mangle
    Decl status(Id, Status) bound [/string, /name].
    status("user1", /active).
    ```
    
    **Changes**:
    - Soufflé `symbol` can be string OR atom
    - Mangle distinguishes `string` (quoted) from `atom` (starts with `/`)
    
    ### Negation
    
    #### Soufflé
    ```souffle
    not_manager(id) :- employee(id, _), !manager(id).
    ```
    
    #### Mangle
    ```mangle
    Decl employee(X, Y).
    Decl manager(Id).
    not_manager(Id) :- employee(Id, _), !manager(Id).
    ```
    
    **Change**: `!` → `not`
    
    ### Aggregation
    
    #### Soufflé
    ```souffle
    dept_total(dept, sum salary) :-
        employee(_, dept, salary).
    ```
    
    #### Mangle
    ```mangle
    Decl employee(X, Y, Z).
    dept_total(Dept, Total) :-
      employee(_, Dept, Salary)
      |> do fn:group_by(Dept),
      let Total = fn:sum(Salary).
    ```
    
    **Changes**:
    - Soufflé has inline aggregation syntax
    - Mangle uses explicit pipe `|>` and `fn:sum()`
    
    ### Subsumption (Max/Min)
    
    #### Soufflé
    ```souffle
    .decl cheapest(product:symbol, price:number)
    cheapest(product, min price) :- item(product, price).
    ```
    
    #### Mangle
    ```mangle
    Decl item(Product, P).
    Decl cheapest(Product, Price) bound [/name, /number].

    cheapest(Product, Price) :-
      item(Product, P)
      |> do fn:group_by(Product),
      let Price = fn:min(P).
    ```
    
    ### Records (Structs)
    
    #### Soufflé
    ```souffle
    .type Person = [name:symbol, age:number]
    .decl person(p:Person)
    person(["Alice", 30]).
    ```
    
    #### Mangle
    ```mangle
    Decl person(P).
    person({ /name: "Alice", /age: 30 }).
    ```
    
    **Changes**:
    - Soufflé uses `[...]` for records
    - Mangle uses `{...}` with `/key: value` syntax
    
    ### Relations as Output
    
    #### Soufflé
    ```souffle
    .output path
    ```
    
    #### Mangle
    ```mangle
    # No explicit output declaration
    # Query any predicate directly
    ```
    
