    ## From Prolog
    
    Prolog is a general-purpose logic language. Mangle is a pure Datalog subset.
    
    ### Facts and Rules
    
    #### Prolog
    ```prolog
    parent(tom, bob).
    parent(bob, ann).
    
    ancestor(X, Y) :- parent(X, Y).
    ancestor(X, Z) :- parent(X, Y), ancestor(Y, Z).
    ```
    
    #### Mangle
    ```mangle
    Decl parent(X, Y) bound [/name, /name].
    Decl ancestor(X, Y) bound [/name, /name].
    
    parent(/tom, /bob).
    parent(/bob, /ann).
    
    ancestor(X, Y) :- parent(X, Y).
    ancestor(X, Z) :- parent(X, Y), ancestor(Y, Z).
    ```
    
    **Changes**:
    - Must declare predicates with `Decl`
    - Atoms use `/` prefix
    - Variables must be UPPERCASE
    
    ### Lists
    
    #### Prolog
    ```prolog
    append([], L, L).
    append([H|T1], L2, [H|T3]) :- append(T1, L2, T3).
    ```
    
    #### Mangle
    ```mangle
    Decl append(L1, L2, Result).
    
    append([], L, L).
    append(List, L2, Result) :-
      :match_cons(List, H, T1),
      append(T1, L2, T3),
      :cons(H, T3, Result).
    ```
    
    **Changes**:
    - List matching uses `:match_cons` instead of `[H|T]` syntax
    - List construction uses `:cons` instead of `[H|T]`
    
    ### Cut (!)
    
    #### Prolog
    ```prolog
    max(X, Y, X) :- X >= Y, !.
    max(X, Y, Y).
    ```
    
    #### Mangle
    ```mangle
    # Mangle does NOT support cut
    # Must use explicit conditions
    
    Decl max(X, Y, Result) bound [/number, /number, /number].
    
    max(X, Y, X) :- X >= Y.
    max(X, Y, Y) :- X < Y.
    ```
    
    **Change**: No `!` operator. Use explicit guards.
    
    ### Arithmetic
    
    #### Prolog
    ```prolog
    factorial(0, 1).
    factorial(N, F) :-
        N > 0,
        N1 is N - 1,
        factorial(N1, F1),
        F is N * F1.
    ```
    
    #### Mangle
    ```mangle
    Decl factorial(N, F) bound [/number, /number].
    
    factorial(0, 1).
    factorial(N, F) :-
      N > 0,
      N1 = fn:minus(N, 1),
      factorial(N1, F1),
      F = fn:mult(N, F1).
    ```
    
    **Changes**:
    - `is` → `=`
    - `N - 1` → `fn:minus(N, 1)`
    - `N * F1` → `fn:mult(N, F1)`
    
    ### Findall
    
    #### Prolog
    ```prolog
    all_children(Parent, Children) :-
        findall(Child, parent(Parent, Child), Children).
    ```
    
    #### Mangle
    ```mangle
    Decl parent(Parent, Child).
    Decl all_children(Parent, Children).

    all_children(Parent, Children) :-
      parent(Parent, Child)
      |> do fn:group_by(Parent),
      let Children = fn:collect(Child).
    ```
    
    **Change**: Use aggregation with `fn:collect`.
    
    ### Assert/Retract
    
    #### Prolog
    ```prolog
    :- assert(new_fact(foo)).
    :- retract(old_fact(bar)).
    ```
    
    #### Mangle
    ```mangle
    # Mangle does NOT support assert/retract
    # Facts are immutable within a program
    # Add/remove facts in Go before evaluation
    ```
    
