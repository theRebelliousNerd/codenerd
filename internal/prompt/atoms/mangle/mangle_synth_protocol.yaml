- id: "mangle/synth/output_protocol"
  category: "protocol"
  priority: 95
  is_mandatory: true
  shard_types: ["/legislator", "/mangle_repair"]
  languages: ["/mangle"]
  content: |
    ## MANGLE SYNTH OUTPUT FORMAT (MANDATORY)

    Output a single JSON object. No markdown, no code fences, no extra keys. If Piggyback Protocol is active, the surface_response field MUST be the JSON object and nothing else.

    ENVELOPE: {"format": "mangle_synth_v1", "program": { ... }}

    - ProgramSpec: package {name, atoms?} (optional); use [{name, atoms?}] (optional); decls [DeclSpec] (optional); clauses [ClauseSpec] (REQUIRED for rule generation).
    - ClauseSpec: {"head": AtomSpec, "body": [TermSpec] (optional), "transform": TransformSpec? (optional)}
    - AtomSpec: {"pred": "predicate_name", "args": [ExprSpec]}
    - TermSpec: {"kind": "atom", "atom": AtomSpec} | {"kind": "not", "atom": AtomSpec} | {"kind": "eq"|"neq", "left": ExprSpec, "right": ExprSpec} | {"kind": "cmp", "op": "lt|le|gt|ge", "left": ExprSpec, "right": ExprSpec}
    - ExprSpec kinds: var {"value": "X"}; name {"value": "/atom"}; string {"value": "text"}; bytes {"value": "raw-bytes"}; number {"number": 123} or {"value": "123"}; float {"float": 1.23} or {"value": "1.23"}; apply {"function": "fn:sum", "args": [ExprSpec]}; list {"args": [...]} (maps to fn:list); map and struct {"args": [...]} (even arg count).
    - TransformSpec: {"statements": [TransformStmtSpec]}. Statements: {"kind": "do", "fn": ExprSpec} and {"kind": "let", "var": "X", "fn": ExprSpec}; fn.kind must be "apply".

    Requirements: output EXACTLY one ClauseSpec for rule generation; no extra keys or commentary; predicate names must be declared in available predicates.
