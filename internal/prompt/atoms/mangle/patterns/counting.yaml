    # Counting Patterns
    
    ## Problem Description
    
    Counting is fundamental for metrics, statistics, and thresholds. Common needs:
    - Count total items
    - Count distinct values
    - Conditional counts
    - Count per group
    - Percentages and ratios
    
    ## Core Pattern: Basic Count
    
    ### Template
    ```mangle
    # Count all items
    total_count(Count) :-
      item(X)
      |> do fn:group_by(),
         let Count = fn:count().
    
    # Count per group
    group_count(Group, Count) :-
      item(X, Group)
      |> do fn:group_by(Group),
         let Count = fn:count().
    ```
    
    ### Complete Working Example
    ```mangle
    # Schema
    Decl user(UserId, Country) bound [/string, /string].
    Decl total_users(Count) bound [/number].
    Decl users_per_country(Country, Count) bound [/string, /number].
    
    # Facts
    user("u1", "USA").
    user("u2", "USA").
    user("u3", "Canada").
    user("u4", "USA").
    user("u5", "Canada").
    
    # Total count
    total_users(Count) :-
      user(UserId, _)
      |> do fn:group_by(),
         let Count = fn:count().
    
    # Count per country
    users_per_country(Country, Count) :-
      user(UserId, Country)
      |> do fn:group_by(Country),
         let Count = fn:count().
    
    # Query: total_users(C)
    # Result: total_users(5)
    
    # Query: users_per_country(Country, C)
    # Results:
    # users_per_country("USA", 3)
    # users_per_country("Canada", 2)
    ```
    
    ## Variation 1: Count Distinct
    
    ### Problem
    Count unique values (not total rows).
    
    ### Solution
    ```mangle
    # Schema
    Decl event(EventId, UserId, EventType) bound [/string, /string, /string].
    Decl event_user(UserId) bound [/string].
    Decl event_type_user(EventType, UserId) bound [/string, /string].
    Decl unique_users(Count) bound [/number].
    Decl unique_users_per_type(EventType, Count) bound [/string, /number].

    # Count distinct users (total). There is no count-distinct reducer on the
    # pinned engine: facts are a set, so project to the distinct columns first.
    event_user(UserId) :- event(Id, UserId, EventType).
    unique_users(Count) :-
      event_user(UserId)
      |> do fn:group_by(),
         let Count = fn:count().

    # Count distinct users per event type
    event_type_user(EventType, UserId) :- event(Id, UserId, EventType).
    unique_users_per_type(EventType, Count) :-
      event_type_user(EventType, UserId)
      |> do fn:group_by(EventType),
         let Count = fn:count().
    ```
    
    ### Example
    ```mangle
    event("e1", "u1", "login").
    event("e2", "u1", "login").  # Same user
    event("e3", "u2", "login").
    event("e4", "u1", "click").
    
    # Results:
    # unique_users(2)  # u1 and u2
    # unique_users_per_type("login", 2)  # u1 and u2
    # unique_users_per_type("click", 1)  # u1 only
    ```
    
    ## Variation 2: Conditional Count
    
    ### Problem
    Count items that meet certain criteria.
    
    ### Solution
    ```mangle
    # Schema
    Decl product(ProductId, Price, InStock) bound [/string, /number, /name].
    Decl expensive_count(Count) bound [/number].
    Decl in_stock_count(Count) bound [/number].
    
    # Count expensive items (Price > 1000)
    expensive_count(Count) :-
      product(ProductId, Price, _),
      Price > 1000
      |> do fn:group_by(),
         let Count = fn:count().
    
    # Count in-stock items
    in_stock_count(Count) :-
      product(ProductId, _, /yes)
      |> do fn:group_by(),
         let Count = fn:count().
    ```
    
    ### Example
    ```mangle
    product("p1", 1500, /yes).
    product("p2", 500, /yes).
    product("p3", 2000, /no).
    product("p4", 800, /yes).
    
    # Results:
    # expensive_count(2)  # p1 and p3
    # in_stock_count(3)   # p1, p2, p4
    ```
    
    ## Variation 3: Count with Zero (Include Empty Groups)
    
    ### Problem
    Show count even for groups with zero items.
    
    ### Solution
    ```mangle
    # Schema
    Decl has_product(CategoryId).
    Decl category(CategoryId) bound [/string].
    Decl product(ProductId, CategoryId) bound [/string, /string].
    Decl product_count(CategoryId, Count) bound [/string, /number].

    # Categories with products
    product_count(CategoryId, Count) :-
      product(ProductId, CategoryId)
      |> do fn:group_by(CategoryId),
         let Count = fn:count().

    # Categories with zero products
    has_product(CategoryId) :- product(_, CategoryId).
    product_count(CategoryId, 0) :-
      category(CategoryId),
      !has_product(CategoryId).
    ```
    
    ### Example
    ```mangle
    category("electronics").
    category("books").
    category("toys").
    
    product("p1", "electronics").
    product("p2", "electronics").
    product("p3", "books").
    
    # Results:
    # product_count("electronics", 2)
    # product_count("books", 1)
    # product_count("toys", 0)  # Explicit zero
    ```
    
    ## Variation 4: Running Total / Cumulative Count
    
    ### Problem
    Count how many items exist up to each point.
    
    ### Solution
    ```mangle
    # Schema
    Decl event(EventId, Timestamp) bound [/string, /number].
    Decl events_before(Timestamp, Count) bound [/number, /number].
    
    # Count events before or at each timestamp
    events_before(T, Count) :-
      event(_, T),
      event(EventId, EventTime),
      EventTime <= T
      |> do fn:group_by(T),
         let Count = fn:count().
    ```
    
    ### Example
    ```mangle
    event("e1", 1000).
    event("e2", 1005).
    event("e3", 1010).
    
    # Results:
    # events_before(1000, 1)  # Just e1
    # events_before(1005, 2)  # e1 and e2
    # events_before(1010, 3)  # All three
    ```
    
    ## Variation 5: Percentage / Ratio
    
    ### Problem
    Calculate percentage of items in each group.
    
    ### Solution
    ```mangle
    # Schema
    Decl user(UserId, Country) bound [/string, /string].
    Decl total_users(Count) bound [/number].
    Decl users_per_country(Country, Count) bound [/string, /number].
    Decl country_percentage(Country, Percentage) bound [/string, /float64].
    
    # Total (from earlier pattern)
    total_users(Count) :-
      user(UserId, _)
      |> do fn:group_by(),
         let Count = fn:count().
    
    # Per country
    users_per_country(Country, Count) :-
      user(UserId, Country)
      |> do fn:group_by(Country),
         let Count = fn:count().
    
    # Percentage
    country_percentage(Country, Percentage) :-
      users_per_country(Country, CountryCount),
      total_users(TotalCount),
      Percentage = fn:div(fn:times(CountryCount, 100.0), TotalCount).
    ```
    
    ### Example
    ```mangle
    user("u1", "USA").
    user("u2", "USA").
    user("u3", "USA").
    user("u4", "Canada").
    
    # Results:
    # total_users(4)
    # users_per_country("USA", 3)
    # users_per_country("Canada", 1)
    # country_percentage("USA", 75.0)
    # country_percentage("Canada", 25.0)
    ```
    
    ## Variation 6: Threshold Filtering (HAVING)
    
    ### Problem
    Filter groups based on their count.
    
    ### Solution
    ```mangle
    # Schema
    Decl purchase(UserId, Amount) bound [/string, /number].
    Decl purchase_count(UserId, Count) bound [/string, /number].
    Decl frequent_buyers(UserId) bound [/string].
    
    # Count purchases per user
    purchase_count(UserId, Count) :-
      purchase(UserId, Amount)
      |> do fn:group_by(UserId),
         let Count = fn:count().
    
    # Only users with 3+ purchases
    frequent_buyers(UserId) :- purchase_count(UserId, Count), Count >= 3.
    ```
    
    ### Example
    ```mangle
    purchase("u1", 100).
    purchase("u1", 200).
    purchase("u1", 150).
    purchase("u2", 300).
    purchase("u2", 400).
    
    # Results:
    # purchase_count("u1", 3)
    # purchase_count("u2", 2)
    # frequent_buyers("u1")  # Only u1 has 3+
    ```
    
    ## Variation 7: Multi-Level Count
    
    ### Problem
    Count at multiple granularity levels.
    
    ### Solution
    ```mangle
    # Schema
    Decl sale(SaleId, StoreId, Region) bound [/string, /string, /string].
    Decl sales_per_store(StoreId, Count) bound [/string, /number].
    Decl sales_per_region(Region, Count) bound [/string, /number].
    
    # Count per store
    sales_per_store(StoreId, Count) :-
      sale(SaleId, StoreId, _)
      |> do fn:group_by(StoreId),
         let Count = fn:count().
    
    # Count per region
    sales_per_region(Region, Count) :-
      sale(SaleId, _, Region)
      |> do fn:group_by(Region),
         let Count = fn:count().
    ```
    
    ### Example
    ```mangle
    sale("s1", "store1", "west").
    sale("s2", "store1", "west").
    sale("s3", "store2", "west").
    sale("s4", "store3", "east").
    
    # Results:
    # sales_per_store("store1", 2)
    # sales_per_store("store2", 1)
    # sales_per_store("store3", 1)
    # sales_per_region("west", 3)
    # sales_per_region("east", 1)
    ```
    
    ## Variation 8: Count Combinations
    
    ### Problem
    Count occurrences of value pairs.
    
    ### Solution
    ```mangle
    # Schema
    Decl event(UserId, Action) bound [/string, /string].
    Decl action_count(UserId, Action, Count) bound [/string, /string, /number].
    
    # Count per user-action pair
    action_count(UserId, Action, Count) :-
      event(UserId, Action)
      |> do fn:group_by(UserId, Action),
         let Count = fn:count().
    ```
    
    ### Example
    ```mangle
    event("u1", "login").
    event("u1", "login").
    event("u1", "click").
    event("u2", "login").
    
    # Results:
    # action_count("u1", "login", 2)
    # action_count("u1", "click", 1)
    # action_count("u2", "login", 1)
    ```
    
    ## Variation 9: Count with Join
    
    ### Problem
    Count items after joining multiple predicates.
    
    ### Solution
    ```mangle
    # Schema
    Decl user(UserId, Country) bound [/string, /string].
    Decl order(OrderId, UserId) bound [/string, /string].
    Decl orders_per_country(Country, Count) bound [/string, /number].
    
    # Join then count
    orders_per_country(Country, Count) :-
      user(UserId, Country),
      order(OrderId, UserId)
      |> do fn:group_by(Country),
         let Count = fn:count().
    ```
    
    ### Example
    ```mangle
    user("u1", "USA").
    user("u2", "USA").
    user("u3", "Canada").
    
    order("o1", "u1").
    order("o2", "u1").
    order("o3", "u2").
    
    # Results:
    # orders_per_country("USA", 3)  # 2 from u1, 1 from u2
    # orders_per_country("Canada", 0)  # No orders from u3 - WAIT, this won't show!
    ```
    
    ### Note on Zero Counts After Joins
    ```mangle
    # To include zero counts:
    Decl country(C) bound [/string].
    country("USA").
    country("Canada").
    
    orders_per_country(Country, Count) :-
      user(UserId, Country),
      order(OrderId, UserId)
      |> do fn:group_by(Country),
         let Count = fn:count().
    
    # Add explicit zero case
    orders_per_country(Country, 0) :-
      country(Country),
      not (user(UserId, Country), order(_, UserId)).
    ```
    
    ## Variation 10: Top N by Count
    
    ### Problem
    Find the N groups with the highest counts.
    
    ### Solution
    ```mangle
    # Schema
    Decl event(UserId, Action) bound [/string, /string].
    Decl action_count(Action, Count) bound [/string, /number].
    Decl top_actions(Action, Count, Rank) bound [/string, /number, /number].
    
    # Count per action
    action_count(Action, Count) :-
      event(UserId, Action)
      |> do fn:group_by(Action),
         let Count = fn:count().
    
    # Rank by count (descending)
    # Note: Mangle doesn't have built-in LIMIT/TOP N
    # Workaround: find max, then next max excluding previous, etc.
    
    # Find maximum count
    Decl max_count(MaxCount) bound [/number].
    max_count(MaxCount) :-
      action_count(Action, Count)
      |> do fn:group_by(),
         let MaxCount = fn:max(Count).
    
    # Actions with max count
    top_actions(Action, Count, 1) :-
      action_count(Action, Count),
      max_count(Count).
    ```
    
    ### Example
    ```mangle
    event("u1", "login").
    event("u2", "login").
    event("u3", "login").
    event("u4", "click").
    event("u5", "click").
    event("u6", "purchase").
    
    # Results:
    # action_count("login", 3)
    # action_count("click", 2)
    # action_count("purchase", 1)
    # max_count(3)
    # top_actions("login", 3, 1)
    ```
    
    ## Anti-Patterns
    
    ### WRONG: Counting Without Grouping
    ```mangle
    # Bad - this counts the same item multiple times if it appears in multiple rules
    count(N) :- item(X), N = 1.
    # Fix: Use aggregation
    count(N) :- item(X) |> do fn:group_by(), let N = fn:count().
    ```
    
    ### WRONG: Forgetting CountDistinct
    ```mangle
    # Bad - counts event rows, not users (and the wildcard keeps the event column)
    user_count(Count) :- event(_, UserId) |> do fn:group_by(), let Count = fn:count().

    # Fix - project to the users first, then count the projection
    event_user(UserId) :- event(E, UserId).
    user_count(Count) :- event_user(UserId) |> do fn:group_by(), let Count = fn:count().
    ```
    
    ### WRONG: Counting Before Filtering
    ```mangle
    # Inefficient - count everything then filter
    all_count(Category, Count) :- item(X, Category) |> do fn:group_by(Category), let Count = fn:count().
    high_count(Category, Count) :- all_count(Category, Count), Count > 100.
    
    # Better - filter first if possible
    # (Though for counts, you usually need to count first then filter)
    ```
    
    ## Performance Tips
    
    1. **Filter Before Counting**: Reduce dataset size before aggregation
    2. **Use CountDistinct Wisely**: More expensive than Count
    3. **Materialize Counts**: If reused, compute once and store
    4. **Index Group Keys**: Ensure grouping columns are indexed
    
    ## Common Use Cases in codeNERD
    
    ### Test Coverage Metrics
    ```mangle
    Decl test_covers(TestId, SourceFile) bound [/string, /string].
    Decl coverage_count(SourceFile, Count) bound [/string, /number].
    
    coverage_count(SourceFile, Count) :-
      test_covers(TestId, SourceFile)
      |> do fn:group_by(SourceFile),
         let Count = fn:count().
    ```
    
    ### Function Call Frequency
    ```mangle
    Decl function_call(CallSite, FuncName) bound [/string, /string].
    Decl call_count(FuncName, Count) bound [/string, /number].
    
    call_count(FuncName, Count) :-
      function_call(CallSite, FuncName)
      |> do fn:group_by(FuncName),
         let Count = fn:count().
    ```
    
    ### Shard Execution Statistics
    ```mangle
    Decl shard_executed(ShardId, TaskId, Status) bound [/string, /string, /name].
    Decl shard_success_count(ShardId, Count) bound [/string, /number].
    
    shard_success_count(ShardId, Count) :-
      shard_executed(ShardId, TaskId, /success)
      |> do fn:group_by(ShardId),
         let Count = fn:count().
    ```
