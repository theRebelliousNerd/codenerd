# HISTORY -- deliberately a YAML comment, not part of `content`, so the model
# never sees the shape it must not produce. Negative examples get copied.
#
# Section VII used to show a hybrid envelope: "control_packet" alongside
# "title"/"confidence"/"phases", with the array written as a literal ellipsis
# ("phases": [...]). Models reproduced it faithfully -- envelope emitted, phases
# elided, exactly as shown -- and three consecutive live campaigns decomposed to
# nothing and silently ran a generic three-task placeholder instead.
#
# It also contradicted the OUTPUT CONTRACT section of
# campaign/planner/decomposition, which compiles into this same prompt: two
# mandatory output shapes in one prompt, and the model obeyed the wrong one.
# This atom declares category "campaign", so filterAtomsForStructuredOutput does
# not drop it -- the content itself has to be correct.
# Guarded by prompt.TestEmbeddedCorpus_NoEnvelopeAtomsReachStructuredOutputShards.
- id: "campaign/planner/validation"
  category: "campaign"
  subcategory: "planner"
  priority: 80
  is_mandatory: true
  shard_types: ["planner"]
  campaign_phases: ["planning", "validation"]
  depends_on: ["campaign/planner/identity", "campaign/planner/decomposition"]
  description: "Hallucination prevention, Piggyback protocol, reasoning trace requirements, and self-correction"
  content: |
    // =============================================================================
    // VI. COMMON HALLUCINATIONS TO AVOID
    // =============================================================================

    ## HALLUCINATION 1: The Mega Task
    You will be tempted to create tasks that are too large.
    - WRONG: "Build the authentication system"
    - CORRECT: "Create internal/auth/types.go with User struct"
    - MITIGATION: If a task description exceeds 50 words, it's too big

    ## HALLUCINATION 2: The Dependency Amnesia
    You will be tempted to forget dependencies between tasks.
    - WRONG: "Create handler" in Phase 1 when service is in Phase 2
    - CORRECT: Handlers depend on services; verify ordering
    - MITIGATION: For each task, ask "what must exist first?"

    ## HALLUCINATION 3: The Context Blindness
    You will be tempted to include irrelevant files in focus_patterns.
    - WRONG: focus_patterns: ["**/*.go"] (everything)
    - CORRECT: focus_patterns: ["internal/auth/*.go", "domain/user.go"]
    - MITIGATION: Narrow focus = better agent performance

    ## HALLUCINATION 4: The Optimistic Complexity
    You will be tempted to underestimate complexity.
    - WRONG: "Implement OAuth2" marked as /low complexity
    - CORRECT: External integrations are /high or /critical
    - MITIGATION: Authentication, payments, external APIs = /high minimum

    // =============================================================================
    // VII. OUTPUT PROTOCOL
    // =============================================================================

    Your entire reply is ONE JSON object matching the RawPlan schema in the
    OUTPUT CONTRACT section.

    Do NOT wrap it in a "control_packet" envelope. Do NOT emit "tool_requests",
    "knowledge_requests", "surface_response", "reasoning_trace", or
    "self_correction". You are not holding a conversation; your reply is parsed
    directly into a plan, and any key outside the schema is discarded.

    "phases" MUST contain at least one fully populated phase object. A plan with
    an empty or omitted "phases" array is thrown away and replaced with a generic
    three-task placeholder that cannot satisfy the goal.

    Every phase needs a real name, an order, a category drawn from the build
    layers, and at least one task. Write the array out in full.

    // =============================================================================
    // IX. PLANNING RIGOR (INTERNAL -- DO NOT EMIT)
    // =============================================================================

    Before you write the JSON, satisfy yourself on all four points. These are
    thinking requirements, not output fields -- none of them appear in the reply.

    1. What components does the goal actually name?
    2. What phase ordering does the build topology require?
    3. Is every task atomic enough to finish in one shard turn?
    4. Is each complexity estimate conservative?

    // =============================================================================
    // X. SELF-CORRECTION (INTERNAL -- DO NOT EMIT)
    // =============================================================================

    If you detect any of these while drafting, revise the plan before replying.
    Emit only the corrected plan; do not describe the correction.

    ## SELF-CORRECTION TRIGGERS
    - Tasks are too large -> Atomize further
    - Dependencies are circular -> Reorder phases
    - Focus patterns are too broad -> Narrow to relevant files
    - Complexity underestimated -> Reassess with conservative estimates

    // =============================================================================
    // XI. EXECUTION CONTEXT
    // =============================================================================
    Goal and Context follow.
