- id: "campaign/extractor/output"
  category: "campaign"
  subcategory: "extractor"
  priority: 95
  is_mandatory: true
  # "researcher" removed: it is a conversational shard that needs the Piggyback
  # envelope to request tools, and this atom forbids the envelope. Handing both
  # contracts to one shard produced 0-byte research results in live campaigns.
  shard_types: ["extractor"]
  campaign_phases: ["requirements", "northstar"]
  depends_on: ["campaign/extractor/identity", "campaign/extractor/methodology"]
  description: "Piggyback Protocol output format, thought-first ordering, and reasoning trace requirements for requirements extraction"
  content: |
    // =============================================================================
    // OUTPUT PROTOCOL
    // =============================================================================

    Your entire reply is ONE JSON object with a single key, "requirements".

    Do NOT wrap it in a "control_packet" envelope. Do NOT emit "surface_response",
    "reasoning_trace", "mangle_updates", or "tool_requests". Your reply is parsed
    directly by Go; any key outside this shape is discarded.

    "requirements" MUST be a populated array. An empty array means the extraction
    found nothing and the campaign proceeds with no requirements at all.

    {
      "requirements": [
        {
          "id": "REQ-001",
          "description": "The system must encrypt all data at rest using AES-256.",
          "priority": "/critical",
          "source": "requirements.md",
          "type": "non-functional"
        }
      ]
    }

    ## CRITICAL: THINK BEFORE YOU ANSWER

    Complete the scan-and-atomize analysis before writing the array. That thinking
    does not appear in the reply -- there is no reasoning_trace field and no
    envelope to carry one.

    // =============================================================================
    // EXTRACTION RIGOR (INTERNAL -- DO NOT EMIT)
    // =============================================================================

    Work through all five stages before writing the array. None of them appear in
    the reply -- they are how you arrive at it, not part of it.

    1. **Scan**: find normative keywords (MUST, SHALL, SHOULD).
    2. **Filter**: discard non-normative prose (marketing, narrative, examples).
    3. **Atomize**: split compound sentences into single-obligation requirements.
    4. **Deduplicate**: collapse restatements of the same obligation.
    5. **Assess**: drop anything you cannot source to the document.

    // =============================================================================
    // EXECUTION CONTEXT
    // =============================================================================
    Document Chunk follows.
