# Code DOM Tools Capability Atoms
# These atoms teach the LLM to use semantic tools instead of text manipulation.
# "Use the scalpel, not the machete."

- id: "capability/codedom_tools"
  category: "capability"
  subcategory: "semantic_editing"
  priority: 87
  is_mandatory: true
  depends_on: ["capability/codedom_core"]
  shard_types: []  # Applies to all personas
  content: |
    ## Semantic Tools: The Right Tool for the Job

    The Code DOM provides specialized tools for semantic editing. Always prefer
    these over text-manipulation approaches like grep+sed.

    ### Available Code DOM Tools

    **Element Discovery (existing source code):**
    - `get_elements` — List elements in a file with 1-indexed file ranges (`path` + optional `type`) and Refs for graph queries
    - `get_element` — Get a specific element by `path` + `name` with its 1-indexed file `start_line`/`end_line`

    **Line-Range Editing (existing code AND existing Markdown):**
    - `edit_lines` — Replace `path` `start_line`–`end_line` (1-indexed file ranges) with `new_content` (required: `path`, `start_line`, `end_line`, `new_content`)
    - `insert_lines` — Insert `content` after `after_line` in `path` (required: `path`, `after_line`, `content`)
    - `delete_lines` — Delete `path` `start_line`–`end_line` (required: `path`, `start_line`, `end_line`)
    - For existing Markdown (`.md`/`.markdown`), locate the heading/range first with one bounded `read_file` range or scoped `grep`, then use these SAME line-range tools (preferred over `edit_file`; `get_elements` does NOT parse Markdown)

    **Impact Analysis:**
    - `get_impacted_tests` - Query which tests would be affected by edits
    - `run_impacted_tests` - Run only the tests affected by changes

    **New file / config fallback:**
    - `write_file` — Create a new file (code or Markdown) with supplied full content (`path` + `content`); correct early-out when no lines/elements exist yet
    - `edit_file` — Edit config/data (`.json`/`.yaml`/`.toml`/`.env`); for existing code/Markdown only a bounded fallback when line-range tools cannot represent the operation or return a concrete failure

    ### Tool vs. Text Approach

    | Task | Wrong (Text) | Right (Semantic / Line-Range) |
    |------|-------------|-----------------|
    | Find function | `grep -n "func Login"` | `get_elements path="internal/auth/user.go" type="/function"` → 1-indexed file ranges + Ref |
    | Edit method (existing code) | `edit_file old_text/new_text` or `sed -i '42,55d'` | `edit_lines path="internal/auth/user.go" start_line=42 end_line=47 new_content="..."` |
    | Edit Markdown section (existing `.md`) | `edit_file old_text/new_text` guess | bounded `read_file`/`grep` locate, then `edit_lines path="docs/guide.md" start_line=42 end_line=55 new_content="..."` (preferred; `get_elements` does NOT parse Markdown) |
    | Create new file with supplied content | `get_elements`/`read_file`/`glob` first | `write_file path="..." content="..."` immediately (code OR Markdown) |
    | Rename field | `find . -name "*.go" \| xargs sed` | Query `wire_name`, use transaction with `edit_lines` per file (`path` + ranges) |
    | Run affected tests | `go test ./...` | `run_impacted_tests --edited-refs [...]` |

    ### get_elements Example

    ```json
    {
      "tool_name": "get_elements",
      "tool_args": {
        "path": "internal/auth/user.go",
        "type": "function"
      }
    }
    ```

    **Returns:**
    ```json
    {
      "elements": [
        {
          "ref": "go:internal/auth/user.go:Login",
          "type": "/function",
          "start_line": 42,
          "end_line": 55,
          "signature": "func Login(ctx context.Context, email, password string) (*User, error)",
          "visibility": "/public"
        }
      ]
    }
    ```
    `start_line`/`end_line` are 1-indexed FILE line ranges. Use them directly with `edit_lines`/`delete_lines` (`path` + range); `insert_lines` uses `after_line`.

    ### edit_lines Example (existing source)

    ```json
    {
      "tool_name": "edit_lines",
      "tool_args": {
        "path": "internal/auth/user.go",
        "start_line": 42,
        "end_line": 47,
        "new_content": "    // Validate credentials\n    if err := validateCredentials(email, password); err != nil {\n        return nil, fmt.Errorf(\"invalid credentials: %w\", err)\n    }"
      }
    }
    ```
    Required: `path`, `start_line`, `end_line`, `new_content`. All line numbers are 1-indexed file ranges, not element-relative. `insert_lines` requires `path`, `after_line`, `content`; `delete_lines` requires `path`, `start_line`, `end_line`.

    ### edit_lines Example (existing Markdown — same tool, bounded locate first)

    ```json
    {
      "tool_name": "read_file",
      "tool_args": {
        "path": "docs/guide.md",
        "start_line": 1,
        "end_line": 80
      }
    }
    ```
    Locate heading, then:
    ```json
    {
      "tool_name": "edit_lines",
      "tool_args": {
        "path": "docs/guide.md",
        "start_line": 42,
        "end_line": 55,
        "new_content": "## Usage\n...updated content...\n"
      }
    }
    ```
    Markdown has no CodeElement parser — do NOT use `get_elements` for Markdown headings or Refs; use one bounded `read_file` range or scoped `grep`, then the same `edit_lines`/`insert_lines`/`delete_lines` with `path` + 1-indexed file ranges (preferred over `edit_file`).

    ### Why File Ranges Matter for Tools

    When you use `path` + 1-indexed file ranges from `get_elements`/`get_element` (code) or a bounded `read_file`/`grep` locate (Markdown):
    1. The system knows the **file boundary** (not element-relative offsets)
    2. Line numbers are **1-indexed file ranges** — every edit shifts lines below it (read the WARNING or re-index before the next edit)
    3. Changes are **validated** and **atomic** where the tool supports it
    4. Dependency tracking via **Ref** (code) remains available for impact analysis (`get_impacted_tests`)

- id: "capability/codedom_test_tools"
  category: "capability"
  subcategory: "semantic_editing"
  priority: 85
  is_mandatory: false
  depends_on: ["capability/codedom_tools"]
  content: |
    ## Smart Test Selection Tools

    Don't run all tests after every change. Use impact analysis to run only
    the tests that actually exercise the modified code.

    ### get_impacted_tests

    Query which tests would be affected without running them:

    ```json
    {
      "tool_name": "get_impacted_tests",
      "tool_args": {
        "edited_refs": [
          "go:internal/auth/user.go:Login",
          "go:internal/auth/user.go:ValidateToken"
        ],
        "include_coverage_gaps": true
      }
    }
    ```

    **Returns:**
    ```json
    {
      "edited_refs": ["go:internal/auth/user.go:Login", ...],
      "impacted_tests": [
        {
          "ref": "go:internal/auth/user_test.go:TestLogin",
          "file": "internal/auth/user_test.go",
          "priority": "high",
          "reason": "depends_on_edited_code",
          "triggers": ["go:internal/auth/user.go:Login"]
        }
      ],
      "impacted_packages": ["./internal/auth"],
      "coverage_gaps": ["go:internal/auth/user.go:RefreshToken"]
    }
    ```

    ### run_impacted_tests

    Run only the affected tests:

    ```json
    {
      "tool_name": "run_impacted_tests",
      "tool_args": {
        "edited_refs": [...],
        "include_low_priority": false,
        "verbose": true,
        "timeout": "5m"
      }
    }
    ```

    ### Test Priority Levels

    - **High**: Test directly calls the edited function
    - **Medium**: Test depends on edited function transitively
    - **Low**: Test is in same package but no detected dependency

    ### Benefits of Smart Test Selection

    | Scenario | Full Test Suite | Smart Selection |
    |----------|----------------|-----------------|
    | Small fix | 50 tests, 2 min | 3 tests, 5 sec |
    | Refactor | 200 tests, 8 min | 15 tests, 30 sec |
    | New feature | 200 tests, 8 min | 0 tests (no deps yet) |

- id: "capability/codedom_query_tools"
  category: "capability"
  subcategory: "semantic_editing"
  priority: 84
  is_mandatory: false
  depends_on: ["capability/codedom_tools"]
  content: |
    ## Querying the Code Graph

    Before making changes, query the dependency graph to understand the codebase.

    ### Mangle Queries via Control Packet

    Add queries to your `mangle_queries` field:

    ```json
    "mangle_queries": [
      {
        "id": "q1",
        "query": "code_element(Ref, /function, File, _, _), fn:contains(Ref, \"Login\")"
      },
      {
        "id": "q2",
        "query": "api_dependency(Backend, Frontend)"
      }
    ]
    ```

    Query results appear in the next turn's context.

    ### Common Useful Queries

    **Find all functions in a file:**
    ```mangle
    :- code_element(Ref, /function, "internal/auth/user.go", Start, End).
    ```

    **Find callers of a function:**
    ```mangle
    :- code_calls(Caller, "go:internal/auth/user.go:Login").
    ```

    **Find data contracts:**
    ```mangle
    :- is_data_contract(Ref).
    ```

    **Find async code without context:**
    ```mangle
    :- is_async_context(Ref), not is_context_aware(Ref).
    ```

    **Find API couplings:**
    ```mangle
    :- api_dependency(Backend, Frontend), wire_name(Backend, Key).
    ```

    **Find test coverage gaps:**
    ```mangle
    :- coverage_gap(Ref, /no_direct_tests).
    ```

    **Find potential panics (Rust):**
    ```mangle
    :- potential_panic(Ref), rs_uses_unwrap(Ref).
    ```

    ### Combining Queries with Actions

    1. **Query**: Find elements matching criteria
    2. **Analyze**: Review the results
    3. **Plan**: Decide which elements to modify
    4. **Edit**: Use `edit_lines`/`insert_lines`/`delete_lines` with `path` + 1-indexed file ranges from `get_elements`/`get_element` (code) or bounded `read_file`/`grep` (Markdown); `edit_file` only on concrete line-tool failure or for config/data formats
    5. **Verify**: Run impacted tests
