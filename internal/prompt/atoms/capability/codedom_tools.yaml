# Code DOM Tools Capability Atoms
# These atoms teach the LLM to use semantic tools instead of text manipulation.
# "Use the scalpel, not the machete."

- id: "capability/codedom_tools"
  category: "capability"
  subcategory: "semantic_editing"
  is_mandatory: true
  depends_on: ["capability/codedom_core"]
  shard_types: []  # Applies to all personas
  requires_tools: [find_symbol, package_outline, callers_of, get_elements, get_element, predicate_outline, find_text]
  content: |
    ## What The CodeDOM Tools Return

    - Rows (`find_symbol`, `package_outline`, `get_elements`, `callers_of` targets, `predicate_outline`): `path:start-end  kind  ref  rev <rev>  signature  // doc`. The span starts at the doc comment. A row is a finished citation; quote it as is.
    - `get_element`: `ref  kind  path:start-end  rev <rev>`, then the source with line numbers.
    - `find_text`: `path:line  ref  in string|comment|identifier  <the literal or comment line>`.

    Kinds: `header`, `function`, `method`, `struct`, `interface`, `type`, `const`, `var`, `syntax_error`; Mangle `decl`, `rule`, `fact`, `query`.

- id: "capability/codedom_test_tools"
  category: "capability"
  subcategory: "semantic_editing"
  is_mandatory: false
  depends_on: ["capability/codedom_tools"]
  requires_tools: [get_impacted_tests, run_impacted_tests]
  content: |
    ## Smart Test Selection Tools

    Do not run every test after every change. Every element edit (edit_element, replace_element, insert_element, delete_element, create_file, repoint) records which elements it changed, so with no arguments:

    - `get_impacted_tests` lists the tests that exercise what you changed, by priority, and the packages holding them (`include_coverage_gaps=true` also lists public functions no test reaches).
    - `run_impacted_tests` runs them (`include_low_priority`, `verbose`, `timeout` optional).

    `edited_refs` narrows either one to elements you name, in the kernel's form: `fn:auth.Login`, `fn:auth.Session.Refresh`, `struct:auth.User`.

    Priorities: **high** - the test calls the edited function; **medium** - it depends on it transitively; **low** - same package, no detected dependency.

- id: "capability/codedom_query_tools"
  category: "capability"
  subcategory: "semantic_editing"
  is_mandatory: false
  depends_on: ["capability/codedom_tools"]
  content: |
    ## Querying the Code Graph

    Before making changes, query the dependency graph to understand the codebase.

    ### Mangle Queries via Control Packet

    Add queries to your `mangle_queries` field:

    ```json
    "mangle_queries": [
      {
        "id": "q1",
        "query": "code_calls(Caller, \"auth.Login\")"
      },
      {
        "id": "q2",
        "query": "api_dependency(Backend, Frontend)"
      }
    ]
    ```

    Query results appear in the next turn's context.

    ### Common Useful Queries

    A query is one atom, optionally led by `?`. To combine conditions, define a rule and query its head.

    **Find all functions in a file:**
    ```text
    ? code_element(Ref, /function, "internal/auth/user.go", Start, End).
    ```

    **Find callers of a function:**
    ```text
    ? code_calls(Caller, "auth.Login").
    ```

    **Find data contracts:**
    ```text
    ? is_data_contract(Ref).
    ```

    **Find async code:**
    ```text
    ? is_async_context(Ref).
    ```

    **Find API couplings:**
    ```text
    ? api_dependency(Backend, Frontend).
    ```

    **Find potential panics (Rust):**
    ```text
    ? potential_panic(Ref).
    ```

    ### Combining Queries with Actions

    1. **Query**: Find elements matching criteria
    2. **Analyze**: Review the results
    3. **Plan**: Decide which elements to modify
    4. **Edit**: Go and Mangle by element ref; Markdown and other files CodeDOM does not parse by line range
    5. **Verify**: Run impacted tests
