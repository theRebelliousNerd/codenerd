# CodeDOM Tool Selection Heuristics
# Teaches the LLM WHEN to use semantic editing vs text manipulation
# This is critical for effective CodeDOM adoption
- id: "capability/codedom_selection"
  category: "capability"
  subcategory: "semantic_editing"
  is_mandatory: true
  depends_on: []
  # edit_file and write_file are not required here. /review admits this atom
  # and does not grant them; those names live on capability/codedom_whole_file.
  # What remains is held by every verb below, including /review.
  requires_tools: [find_symbol, get_elements, get_element, callers_of, edit_element, edit_lines]
  intent_verbs: ["/fix", "/implement", "/refactor", "/create", "/debug", "/review", "/test"]
  content: |
    ## Worked Examples: One Edit, Done Right

    **Existing code - "fix Login":**
    ```
    find_symbol  name="Login"
      -> internal/auth/user.go:40-55  function  internal/auth.Login  rev 3fa2c1d4e5f6  func Login(...) error
    get_element  ref="internal/auth.Login"                 (the source, lines numbered)
    edit_element path="internal/auth/user.go" ref="internal/auth.Login" old="return nil, nil" new="return nil, err"
      -> the element's new text and rev; nothing to re-read, no import to add by hand
    ```

    **A message quoted in a brief** ("Vector recall query failed"): `find_text text="Vector recall query failed"` answers with the element that logs it.

    **Existing Markdown - "update the Usage section":** a Markdown section is an element, addressed by its heading path; never edit a doc by line numbers:
    ```
    get_elements path="docs/guide.md"
      -> docs/guide.md:12-30  section  docs/guide.md:Guide > Usage  rev 3fa2c1d4e5f6  ## Usage
    edit_element path="docs/guide.md" ref="Guide > Usage" old="Run it." new="Run it with --fast."
    ```

    **Wrong:** reading a whole Go file to find a function; editing Go or Markdown by line numbers; writing an import line; grepping for who calls or imports something.

    Before an edit, two questions: does the target exist (a new Go or Mangle file is `create_file`), and does anything else have to change with it (`callers_of`, `importers_of` first; moving or renaming a package-level name is one `repoint`).

- id: "capability/codedom_workflow"
  category: "capability"
  subcategory: "semantic_editing"
  is_mandatory: false
  depends_on: ["capability/codedom_selection"]
  requires_tools: [find_symbol, package_outline, get_element, callers_of, callees_of, edit_element, replace_element, insert_element]
  intent_verbs: ["/fix", "/implement", "/refactor"]
  content: |
    ## Standard CodeDOM Workflow

    1. **Locate** - `find_symbol` (a name, several names `A|B`, or a `pattern`), `package_outline` for a directory, `find_text` for a message or comment, `predicate_outline` for a Mangle predicate. Each answers with refs.
    2. **Read** - `get_element ref=...` (or `refs=[...]`); for an element over 400 lines, its outline, then `part=`.
    3. **Understand the reach** - `callers_of`, `callees_of`, `importers_of`. A change to a signature, an exported name or a struct field reaches everything they list.
    4. **Edit** - `edit_element` for text inside one element; `replace_element` for all of it; `insert_element` for new declarations; `delete_element` to remove one; `repoint` to move every use of a name; `create_file` for a new file. Each answer is the new text and rev: carry on from it.
    5. **Verify** - run the tests covering the elements your edits changed (the impacted tests), then the build.

    A refusal writes nothing. Read why (a parse error, an untargeted element that would change, an ambiguous anchor, remaining uses) and correct the call; do not route around it with a line or whole-file tool.

- id: "capability/codedom_selection/markdown"
  section_of: "capability/codedom_selection"
  section_order: 1
  category: "capability"
  subcategory: "semantic_editing"
  is_mandatory: false
  depends_on: []
  requires_tools: [get_elements, get_element, edit_element]
  intent_verbs: ["/fix", "/implement", "/refactor", "/create", "/debug", "/review", "/test"]
  content: |
    ## Worked Examples: Markdown By Section

    A section is a heading with its body and nested sections; `#` lines inside code fences and front matter are not headings.
    ```
    insert_element path="docs/guide.md" anchor="Guide > Usage" position="inside" source="## Flags\n..."
      -> a new child section; its headings are re-levelled to fit, and the answer says by how much
    insert_element path="docs/guide.md" anchor="Guide > Usage" position="after" source="## Config\n..."
      -> a sibling after Usage and all its nested sections
    replace_element path="docs/guide.md" ref="Guide > Usage" source="## Usage\n..."
    delete_element  path="docs/guide.md" ref="Guide > Usage"
    ```
    `replace_element` rewrites a whole section (source starts with its heading); `delete_element` removes it with its nested sections. A section that disappeared since you listed it is refused with the sections the file has: take the ref from that list.
