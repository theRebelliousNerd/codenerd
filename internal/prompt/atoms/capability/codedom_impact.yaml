# Code DOM Impact Analysis Atoms
# These atoms teach the LLM to query impact BEFORE editing.
# "Measure twice, cut once" applied to code changes.

- id: "capability/codedom_impact"
  category: "capability"
  subcategory: "semantic_editing"
  priority: 92
  is_mandatory: true
  depends_on: ["capability/codedom_core"]
  requires_tools: [callers_of, get_element, edit_element]
  shard_types: []  # Applies to all personas
  content: |
    ## Blast Radius: Look Before Changing A Contract

    An edit inside a function body is local. An edit to a signature, an exported name, a struct field, or a serialized field name is not: something else depends on it.

    Before changing a contract:

    1. Find what depends on it: `callers_of` for a function or method, `importers_of` for a package, `find_text` for a wire name (a `json:"user_id"` tag is also read by whatever else speaks that format).
    2. Moving or renaming a package-level name is one `repoint from=... to=... paths=[...]`: every use rewritten, imports derived, every file parsed, all written or none. Deleting a name that is still used is refused until its uses are repointed (`delete_element replace_with=...`).
    3. Otherwise change the declaration, then each dependent the queries listed, and run the build.

    If dependency facts for the target were injected into your context (callers, methods of a type, covering tests), use them first: they come from the code graph.

- id: "capability/codedom_safety"
  category: "capability"
  subcategory: "semantic_editing"
  priority: 91
  is_mandatory: true
  depends_on: ["capability/codedom_impact"]
  content: |
    ## Edit Safety: What Gets Blocked

    Line-range edits are applied to a shadow copy, re-parsed, and checked against the kernel's `deny_edit` rules before anything is written. If a rule fires, nothing is modified and the result names the rule. Edits that are refused:

    - removing error handling from a Go function that returned an error
    - starting a goroutine with no context to stop it
    - removing an auth decorator
    - introducing an `unsafe` block
    - changing one side of a backend/frontend API contract without the other

    When blocked: fix the cause and retry. Do not route around the block with `edit_file` or `write_file`; if the rule is wrong for this case, say so and stop. An `edit_warning` (e.g. no test covers the function) is reported but does not block.

- id: "capability/codedom_transaction"
  category: "capability"
  subcategory: "semantic_editing"
  priority: 89
  is_mandatory: false
  depends_on: ["capability/codedom_safety"]
  content: |
    ## Transactional Editing: Two-Phase Commit

    Multi-file refactors use a **Two-Phase Commit (2PC)** protocol to ensure
    atomicity. Either all changes succeed, or none are applied.

    ### The 2PC Protocol

    **Phase 1: Prepare**
    1. Create snapshots of all affected files
    2. Apply proposed edits to shadow filesystem
    3. Re-parse all modified files (syntax check)
    4. Run Mangle safety rules on candidate state
    5. If any `deny_edit` fires → ABORT
    6. Mark transaction as READY

    **Phase 2: Commit**
    1. Write all changes to real filesystem atomically
    2. If any write fails → ROLLBACK using snapshots
    3. Emit `file_written` facts to kernel
    4. Mark transaction as COMMITTED

    ### Transaction States

    - `pending` - Initial state, collecting edits
    - `preparing` - Running shadow validation
    - `ready` - All validations passed, safe to commit
    - `committing` - Writing to filesystem
    - `committed` - Successfully completed
    - `aborted` - Rolled back due to failure

    ### Why Transactions Matter

    **Without Transactions:**
    - Edit file A: SUCCESS
    - Edit file B: PARSE ERROR
    - Result: A is modified, B is not → **Inconsistent State**

    **With Transactions:**
    - Edit file A: (staged in shadow)
    - Edit file B: PARSE ERROR detected in prepare phase
    - Result: ABORT → Neither A nor B modified → **Consistent State**

    ### Using Transactions

    When using `edit_element` or similar tools:
    1. All edits in a single request are automatically transactional
    2. If you need multiple requests, use explicit transaction control:
       - `begin_transaction` - Start a new transaction
       - `add_edit` - Queue an edit
       - `prepare` - Validate (returns validation result)
       - `commit` or `abort` - Finalize

    ### Rollback Capability

    If commit fails mid-way (e.g., disk full), the system automatically
    restores all files from their snapshots, ensuring no partial modifications.
