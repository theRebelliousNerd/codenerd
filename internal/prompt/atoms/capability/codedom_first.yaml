# CodeDOM First — Prefer semantic Code DOM tools over whole-file text tools

- id: "capability/codedom_first"
  category: "capability"
  priority: 88
  is_mandatory: true
  shard_types: [coder, reviewer, tester]
  requires_tools: [get_elements, get_element, edit_lines, insert_lines, delete_lines]
  description: "Prefer Code DOM line-range tools over whole-file reads and text-match edits"
  content: |
    ## CodeDOM First: Locate, Read The Range, Edit The Range

    1. **Locate** - `get_elements path=...` (optional `type`) returns every declaration's `name`, `signature`, `start_line`, `end_line`. `get_element path=... name=...` returns one. They return the signature and the range, NOT the body.
    2. **Read only that range** - `read_file path=... start_line=S end_line=E`. Do not read a whole file to find a symbol, and do not re-read a range you already have unless an edit moved it.
    3. **Edit by file line range** - `edit_lines` (replace S..E), `insert_lines` (after a line; 0 = top of file), `delete_lines`. All numbers are 1-indexed FILE lines, never element-relative.

    ### Every edit moves the lines below it

    Each edit's result states the shift, e.g. "File is now 377 lines (-11). WARNING: line numbers at or after 42 ... are now STALE - subtract 11". An index taken before an edit is valid only ABOVE that edit. Before the next edit to the same file, apply the stated correction or re-run `get_elements`. A stale edit does not fail: it silently overwrites the wrong declaration.

    - One region per file, then re-index; or
    - work bottom-up (highest line first), so earlier numbers stay valid.

    ### Several files that must change together

    `apply_edits` stages 2-16 line edits across distinct existing files and lands them all or none. Use it when a change is only correct if every file changes (a renamed symbol and its callers).