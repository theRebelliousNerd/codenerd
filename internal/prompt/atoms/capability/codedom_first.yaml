# CodeDOM First — edit Go and Mangle code and Markdown docs by element, validated before it is written

- id: "capability/codedom_first"
  category: "capability"
  is_mandatory: true
  shard_types: [coder, reviewer, tester]
  requires_tools: [find_symbol, package_outline, get_elements, get_element, edit_element, replace_element, insert_element, delete_element, create_file, repoint]
  description: "Address Go and Mangle code by element ref and rev; every edit is parsed, gofmt'd and import-derived before it is written"
  content: |
    ## CodeDOM First: Address Code By Element, Not By Line

    Go and Mangle files are parsed. Every declaration, and a Go file's `header` (package clause, file doc, imports), is an element with a **ref** and a **rev**, printed by `find_symbol`, `package_outline`, `get_elements`, `get_element`.

    **Change it** - give `path` and `ref` (as printed, or its name in that file):
    - `edit_element old=... new=...`: replaces text inside one element; `old` must occur once in it (or in `part`). Most edits are this.
    - `replace_element source=...`: replaces the whole element, doc comment included.
    - `insert_element anchor=<ref|header|end> position=before|after source=...`: adds declarations.
    - `delete_element`: refused while anything still uses the name (lists the uses); `replace_with` + `paths` repoints them in the same call.
    - `create_file`: new Go or Mangle file. `repoint from=... to=... paths=[...]`: moves every use of a package-level name to another, across files, in one call.

- id: "capability/codedom_first/see-and-trust"
  section_of: "capability/codedom_first"
  section_order: 1
  category: "capability"
  is_mandatory: false
  shard_types: [coder, reviewer, tester]
  requires_tools: [find_symbol, package_outline, get_elements, get_element, edit_element, replace_element, insert_element, delete_element, create_file, repoint]
  description: "Address Go and Mangle code by element ref and rev; every edit is parsed, gofmt'd and import-derived before it is written: See it, trust the answer"
  content: |
    ## CodeDOM First (see and verify)

    1. **See it** - `get_element ref=...` returns the source with doc comment, numbered lines and rev; several at once with `refs=[...]`. An element over 400 lines answers with an outline of its parts (statements, case clauses, closures); ask for one with `part=12.3`.
    2. **Trust the answer** - nothing is written unless the file parses, every other element keeps its bytes, the touched declaration is gofmt'd, and imports are derived: write no import lines, unused ones are dropped. The answer lists imports added or dropped and shows each changed element with its new rev, so do not read it again. `revision=<rev>` refuses the edit if the element changed since you saw it.

- id: "capability/codedom_first/refusals"
  section_of: "capability/codedom_first"
  section_order: 2
  category: "capability"
  is_mandatory: false
  shard_types: [coder, reviewer, tester]
  requires_tools: [find_symbol, package_outline, get_elements, get_element, edit_element, replace_element, insert_element, delete_element, create_file, repoint]
  description: "Address Go and Mangle code by element ref and rev; every edit is parsed, gofmt'd and import-derived before it is written: Refusals and fallbacks"
  content: |
    ## CodeDOM First (refusals and fallbacks)

    A refusal writes nothing and says why: the parse error, the elements the edit would have changed, where an ambiguous anchor occurs, the uses that block a delete, or the element's current text when a rev precondition failed. Correct the call; do not route around it with a line or whole-file tool.

    A file that does not parse lists its broken region as a `syntax_error` element: see it with `get_element`, repair it with `replace_element ref=syntax_error`.

    Line-range and whole-file editing is for files CodeDOM does not parse: plain text, YAML, other languages.

- id: "capability/codedom_first/markdown"
  section_of: "capability/codedom_first"
  section_order: 3
  category: "capability"
  is_mandatory: false
  shard_types: [coder, reviewer, tester]
  requires_tools: [get_elements, get_element, edit_element, replace_element, insert_element, delete_element]
  description: "Edit Markdown docs by section with the element verbs: heading-path refs, re-levelled inserts"
  content: |
    ## CodeDOM First (Markdown)

    A Markdown file (`.md`) is parsed too. Every heading opens a **section** element: its heading, body and nested sections, ref = its heading path (`docs/guide.md:Install > Linux`; a repeated heading is `Install > Linux#2`). Fenced code blocks and tables are elements (`... > code#1`, `... > table#1`); `#` lines inside fences and front matter are not headings.

    The same verbs apply:
    - `edit_element ref="Install > Linux" old=... new=...`: text inside a section.
    - `replace_element`: a whole section; `source` starts with its heading.
    - `insert_element anchor=<section> position=before|after|inside source="## Heading..."`: a new section; its headings are re-levelled to fit and the answer says by how much.
    - `delete_element`: a section with its nested sections.

    A ref to a section that is gone is refused with the sections the file has.
