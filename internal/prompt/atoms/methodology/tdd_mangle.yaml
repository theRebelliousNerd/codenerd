# Mangle-Specific TDD Workflow
# TDD methodology for Mangle logic using Go test harnesses

- id: "methodology/tdd/mangle_workflow"
  category: "methodology"
  subcategory: "tdd"
  is_mandatory: false
  languages: ["/mangle"]
  intent_verbs: ["/test", "/fix", "/implement"]
  content: |
    ## MANGLE LOGIC TDD PROTOCOL

    Test rules with a Go harness, not by eye.

    ### 1. RED (Define the Case)
    Write a table-driven Go test with the input facts (EDB) and the expected derived facts (IDB).

    ```go
    tests := []struct {
        name string
        edb  []ast.Clause // input facts
        want ast.Atom     // expected derivation
    }{
        {
            name: "Admin Access",
            edb:  []ast.Clause{fact("admin", mustName("/alice"))},
            want: atom("access", mustName("/alice")),
        },
    }
    ```

    ### 2. GREEN (Implement Logic)
    Write the Mangle rule to satisfy the case.

    ```mangle
    Decl admin(User).
    access(User) :- admin(User).
    ```

    ### 3. VERIFY (Run Harness)
    The harness MUST:
    1. **Fresh Store**: `factstore.NewSimpleInMemoryStore()` per test; add the EDB with `store.Add`.
    2. **Analyze**: `analysis.AnalyzeOneUnit(unit, nil)` catches unbound variables and unknown functions; `analysis.AnalyzeAndCheckBounds` also checks Decl types.
    3. **Eval**: `engine.EvalStratifiedProgramWithStats(info, strata, predToStratum, store)`, strata from `analysis.Stratify`.
    4. **Assert**: `store.Contains(want)`, or read rows with `store.GetFacts(ast.NewQuery(sym), cb)`.

    ### CRITICAL SAFETY CHECKS
    - **Atom vs String**: `ast.Name("/foo")` (returns a constant and an error; the text starts with `/`) is `/foo`; `ast.String("foo")` is `"foo"`. They DO NOT match.
    - **Clean Slate**: never reuse a store between cases.
    - **Termination**: pass `engine.WithCreatedFactLimit(n)` so runaway recursion fails the test.
