# Go-Specific TDD Workflow
# Concrete implementation of TDD methodology for Go projects

- id: "methodology/tdd/go_workflow"
  category: "methodology"
  subcategory: "tdd"
  is_mandatory: false
  languages: ["/go", "/golang"]
  intent_verbs: ["/test", "/fix", "/implement"]
  content: |
    ## GO TDD WORKFLOW

    RED: Add a regression assertion that fails without the fix. Confirm the
    specific failure with `go test -count=1 -run TestName/CaseName ./edited/pkg`.
    GREEN: Make the smallest fix; rerun that test until it passes.
    REFACTOR: Preserve behavior, then test the edited packages.

    During a fix use `run_impacted_tests` for covering tests and `run_tests`
    for edited packages. Scope build, vet, coverage and race checks likewise.
    Repair narrow failures before any repository-wide run.

    Run `go test -count=1 ./...` once as the final gate: all edits/repairs done,
    narrow runs passing. Never repeat it on unchanged covered inputs, even
    after failure. Repair with narrow runs first; a covered change invalidates
    prior full-suite evidence. For `/fix`, the session owns that final gate:
    do not request `run_tests` with `["./..."]` in the working loop.

    Flags: `-race` for concurrency; `-count=1` for fresh results;
    `-shuffle=on` to probe order dependencies. Never skip acceptance tests
    or weaken assertions to get green.
