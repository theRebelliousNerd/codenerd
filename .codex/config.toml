[agents.stress_tester]
description = "Validation runner for go test, go build, campaigns, stress workflows, and failure reproduction. Use when the main need is to execute and observe behavior."
config_file = "agents/stress-tester.toml"

[agents.spec_sprinter]
description = "Repo documentation writer for subsystem specs, implementation notes, and grounded architectural writeups based on source code."
