[agents.nerd_orchestrator]
description = "Multi-phase codeNERD operator for CLI workflows, campaign-style tasks, architecture navigation, and coordinating several specialists. Avoid for routine single-surface edits."
config_file = "agents/nerd-orchestrator.toml"

[agents.aegisdb_test_architect]
