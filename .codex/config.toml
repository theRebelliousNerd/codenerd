#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.4"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
project_root_markers = [".git", "go.mod", "AGENTS.md"]
project_doc_max_bytes = 262144

developer_instructions = """
codeNERD is a logic-first Go and Mangle codebase.
Prefer narrow, verifiable changes and stay alert for wiring gaps before calling anything unused or dead.
For new LLM systems, the standard is JIT prompt assembly with prompt atoms, piggybacking, and control-packet aware behavior.
Prefer the repo's auto-discovered .agents/skills when the task matches one of them.
Route to the narrowest specialist that clearly owns the work.
Prefer read-only specialists for exploration, review, external docs, wiring audits, and log forensics.
Use worker only as a fallback for small mixed edits when no stronger specialist clearly fits.
"""

[windows]
sandbox = "elevated"

[features]
multi_agent = true
hooks = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 2700

[agents.explorer]
description = "Read-only first-pass codebase tracer. Use for finding files, symbols, execution paths, ownership, and impact before any patch, review, or audit."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Fallback implementation agent for small mixed-surface edits when no stronger specialist clearly fits. Do not use for kernel architecture, Mangle-only, prompt-only, review-only, docs-only, or test-only work."
config_file = "agents/worker.toml"

[agents.kernel_builder]
description = "Core architecture implementer for internal/core, internal/prompt, shard lifecycle, memory tiers, orchestration, and system wiring across packages."
config_file = "agents/kernel-builder.toml"

[agents.go_implementer]
description = "Go code implementer for normal production patches, refactors, error handling, concurrency fixes, and tests when the work is primarily Go rather than Mangle, prompt architecture, or system orchestration."
config_file = "agents/go-implementer.toml"

[agents.reviewer]
description = "Read-only patch reviewer for correctness, regressions, security, and missing tests after a change exists. Not the primary agent for tracing lifecycle wiring."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Read-only external-docs verifier for Codex, OpenAI, Mangle, Go libraries, and framework APIs. Use for source-backed behavior checks, not repo documentation writing or ingestion code."
config_file = "agents/docs-researcher.toml"

[agents.integration_auditor]
description = "Read-only wiring auditor for registrations, lifecycle hooks, routing, prompts, persistence, and missing execution links across the system."
config_file = "agents/integration-auditor.toml"

[agents.log_investigator]
description = "Read-only log forensics specialist for runtime failures, shard traces, log correlation, and performance signatures after something has already run."
config_file = "agents/log-investigator.toml"

[agents.mangle_specialist]
description = "Mangle specialist for .mg and .gl files, schemas, policy rules, recursion, stratification, safety, and logic-derived behavior."
config_file = "agents/mangle-specialist.toml"

[agents.mangle_logic_architect]
description = "Deep-design Mangle specialist for predicate design, aggregation, recursion, stratification, and logic debugging when the task needs more than routine Mangle edits."
config_file = "agents/mangle-logic-architect.toml"

[agents.prompt_architect]
description = "Prompt-system specialist for JIT prompt assembly, prompt atoms, piggybacking, context injection, agent instructions, and LLM behavior shaping."
config_file = "agents/prompt-architect.toml"

[agents.research_builder]
description = "Knowledge-ingestion implementer for llms.txt, Context7-style retrieval, specialist hydration, knowledge atom extraction, and persistent memory plumbing."
config_file = "agents/research-builder.toml"

[agents.gemini_specialist]
description = "Gemini-specific implementer for thinking mode, grounding tools, thought signatures, document flows, and Google-model integration details."
config_file = "agents/gemini-specialist.toml"

[agents.cli_engine_specialist]
description = "CLI engine implementer for Claude Code CLI and Codex CLI backends, subprocess streaming, auth/config flow, and engine selection."
config_file = "agents/cli-engine-specialist.toml"

[agents.tui_specialist]
description = "Terminal UI implementer for Bubble Tea, Bubbles, Lipgloss, terminal layout, interaction flows, and TUI stability."
config_file = "agents/tui-specialist.toml"

[agents.browser_specialist]
description = "Rod and Chromium automation implementer for browser control, CDP flows, scraping, screenshots, session management, and E2E probes."
