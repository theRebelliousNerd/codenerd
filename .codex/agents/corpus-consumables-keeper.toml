# Ported from codeNERD Claude/Grok behavior and rewritten for native Codex activation.
name = "corpus_consumables_keeper"
description = "Synchronize prompt atoms, embedded Mangle corpora, generated assets, skill mirrors, and registries."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
