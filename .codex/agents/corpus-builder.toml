# Ported from codeNERD Claude/Grok behavior and rewritten for native Codex activation.
name = "corpus_builder"
description = "Implement one bounded corpus-build work packet when no narrower implementation lane owns it."
model = "gpt-5.6"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "medium"
sandbox_mode = "workspace-write"

developer_instructions = """
Implement only the assigned files and symbols. Preserve codeNERD's logic-first architecture, JIT prompt rule, Mangle declarations, and constitutional permission path. Run the packet gates and return the fleet completion record.

Read the root AGENTS.md and the attached skill packages before acting. Stay inside the assigned role and artifact/file ownership. Do not spawn subagents. Preserve unrelated dirty-tree changes. Verify repository claims against the live tree and return exact paths, commands, results, assumptions, skips, and residual risks to the parent agent.
"""

[[skills.config]]
path = "C:/CodeProjects/codeNERD/.codex/skills/corpus-build"
enabled = true

[[skills.config]]
path = "C:/CodeProjects/codeNERD/.agents/skills/go-architect"
enabled = true
