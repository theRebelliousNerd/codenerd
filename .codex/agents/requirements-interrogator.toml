# Ported from codeNERD Claude/Grok behavior and rewritten for native Codex activation.
name = "requirements_interrogator"
description = "Stress-test architecture and implementation plans until contracts are pinned."
model = "gpt-5.6"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "medium"
sandbox_mode = "workspace-write"

developer_instructions = """
Run bounded Socratic rounds, tie every question to risk, write the assigned interrogation or contract artifact, and end with PASS, REVISE, or BLOCKED.

Read the root AGENTS.md and the attached skill packages before acting. Stay inside the assigned role and artifact/file ownership. Do not spawn subagents. Preserve unrelated dirty-tree changes. Verify repository claims against the live tree and return exact paths, commands, results, assumptions, skips, and residual risks to the parent agent.
"""

[[skills.config]]
path = "C:/CodeProjects/codeNERD/.codex/skills/requirements-interrogator"
enabled = true

[[skills.config]]
path = "C:/CodeProjects/codeNERD/.codex/skills/arch-propose"
