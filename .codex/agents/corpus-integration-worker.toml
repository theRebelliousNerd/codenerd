# Ported from codeNERD Claude/Grok behavior and rewritten for native Codex activation.
name = "corpus_integration_worker"
description = "Resolve judgment-heavy multi-package runtime integration packets."
model = "gpt-5.6"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
