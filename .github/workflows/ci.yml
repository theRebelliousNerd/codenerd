name: CI

# Runs on Windows because that is the platform this repo is developed and
# tested on, and several tests are genuinely platform-specific: atomic replace
# goes through ReplaceFileW, path containment has Windows-only cases, and the
# monotonic clock granularity here is ~0.5ms. A Linux-only pipeline would pass
# while leaving exactly the class of defect this repo keeps finding.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # internal/store/vec_support_enabled.go is behind `sqlite_vec && cgo`.
  # Without the tag the binary silently falls back from ANN to lexical search,
  # so every job here builds with it. The headers are vendored in-repo.
  CGO_CFLAGS: -I${{ github.workspace }}/sqlite_headers

jobs:
  build-and-test:
    name: build + test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -tags sqlite_vec ./...
      - name: Vet
        run: go vet -tags sqlite_vec ./...
      - name: Reject empty and log-only tests
        run: go run ./cmd/tools/audit_test_bodies .
      # predicate_corpus.db is generated from the .mg corpus and embedded into
      # the binary, where it tells a model which predicates exist and what shape
      # they are. It had drifted seven weeks: eight browser predicates recorded
      # one argument short, and 150 declarations missing. Feeding a model an
      # arity the schema does not have invites a duplicate Decl, which takes the
      # kernel down at boot. Rows carry a build timestamp, so `git diff` cannot
      # gate it — the check compares name/arity/type instead.
      - name: Predicate corpus is current
        run: go run ./cmd/tools/predicate_corpus_builder -check
      - name: Test through Windows path aliases
        run: ./scripts/test_windows_path_identity.ps1 -Full

  deadcode:
    # The Go half of this repo's recurring defect: a function defined and
    # exported that nothing calls. Its Mangle twin — a predicate declared and
    # read by rules that nothing produces — is gated by
    # TestStarvedPredicateBudget, which the test job already runs.
    #
    # Both are budgets, not targets of zero. They fail when the number moves in
    # either direction, so the baseline stays a measurement instead of rotting
    # into a file nobody trusts.
    #
    # bash is Git Bash on the Windows runner; the script normalises separators
    # and line endings for exactly that reason.
    name: dead-code budget
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Dead-code budget
        shell: bash
        run: ./scripts/deadcode-budget.sh

  race:
    # Closes the mcp backlog item "-race CI for manager+store". Scoped to those
    # two packages rather than the whole tree: -race is slow, and these are the
    # ones with concurrent manager state worth pinning.
    name: race (mcp + store)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race detector
        run: go test -race -tags sqlite_vec ./internal/mcp/... ./internal/store/...

  simd:
    # Closes the retrieval backlog item "SIMD-tagged CI job".
    #
    # This job is the reason the tag works at all. Adding it first proved the
    # `simd` build had never compiled against the toolchain in go.mod:
    # internal/mangle and internal/retrieval each built an archsimd vector and
    # then read it back element by element - scalar comparisons wearing a SIMD
    # costume - which Go 1.26 rejects because those vectors are opaque structs.
    # Both were deleted; their generic implementations are now unconditional.
    #
    # What remains behind the tag is internal/embedding, which uses the real
    # API (LoadFloat32x8Slice + horizontal reduction). Without this job that
    # path is never compiled, which is exactly how the other two rotted.
    #
    # GOEXPERIMENT=simd is required: simd/archsimd is gated behind it, and
    # without it the import fails with "build constraints exclude all Go files".
    name: simd (experiment)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with the simd tag
        run: go build -tags "sqlite_vec simd" ./...
      - name: Test the SIMD-selected packages
        run: go test -tags "sqlite_vec simd" ./internal/embedding/... ./internal/mangle/... ./internal/retrieval/...
